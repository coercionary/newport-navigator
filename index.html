<!DOCTYPE html>
<html lang="en" class="mode-drive">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover"/>
<title>Newport Navigator</title>
<meta name="description" content="Family map for Lime Kiln House — Newport, Co. Mayo. Works offline."/>
<link rel="manifest" href="manifest.webmanifest"/>
<meta name="theme-color" content="#0f766e"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
<meta name="apple-mobile-web-app-title" content="Newport Nav"/>
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png"/>
<link rel="icon" href="icons/icon-192.png"/>
<style>
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;height:100%;height:100dvh;overflow:hidden;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;color:#243;background:#d4cbb3;}
  body{display:flex;flex-direction:column;}
  #topbar{flex:0 0 auto;z-index:110;position:relative;background:#faf7f0;}
  header{background:linear-gradient(135deg,#0f766e,#0284c7);color:#fff;padding:calc(env(safe-area-inset-top) + 8px) 12px 8px;box-shadow:0 2px 10px rgba(0,0,0,.18);}
  .headrow{display:flex;align-items:center;justify-content:space-between;gap:10px;}
  header h1{margin:0;font-size:17px;display:flex;align-items:center;gap:8px;}
  .headbtns{display:flex;align-items:center;gap:4px;flex:0 0 auto;}
  .iconbtn{width:40px;height:40px;padding:0;border:none;border-radius:10px;background:transparent;color:#fff;cursor:pointer;display:flex;align-items:center;justify-content:center;}
  .iconbtn:active{background:rgba(255,255,255,.18);}
  .iconbtn svg{width:22px;height:22px;display:block;}
  .iconbtn.primary{background:#fff;color:#0f766e;}
  .iconbtn.primary:active{background:#e6fffb;}
  #findrow{display:flex;align-items:stretch;gap:8px;padding:8px 12px 6px;background:#faf7f0;}
  #qfind{flex:1;min-width:0;border:1.5px solid #c4bba8;border-radius:10px;padding:10px 12px;font:inherit;font-size:16px;color:#243;background:#fff;}
  #qfind:focus{outline:none;border-color:#0f766e;box-shadow:0 0 0 3px rgba(15,118,110,.18);}
  #searchview{display:flex;flex:0 0 auto;padding:0;background:transparent;}
  #searchview .modebtn{flex:0 0 auto;padding:8px 11px;font-size:13px;}
  #searchview .modebtn[aria-pressed="true"]{background:#0f766e;border-color:#0f766e;color:#fff;}
  #modewrap{display:flex;padding:0 12px 6px;background:#faf7f0;}
  .modebtn{flex:1;border:1.5px solid #c4bba8;background:#fff;color:#4b5563;padding:6px 4px;font-size:12px;font-weight:700;cursor:pointer;font-family:inherit;line-height:1.2;}
  .modebtn + .modebtn{border-left-width:0;}
  .modebtn:first-child{border-radius:9px 0 0 9px;}
  .modebtn:last-child{border-radius:0 9px 9px 0;}
  .modebtn[aria-pressed="true"]{position:relative;z-index:1;border-left-width:1.5px;color:#fff;}
  .modebtn[data-mode="drive"][aria-pressed="true"]{background:#1d4ed8;border-color:#1d4ed8;}
  .modebtn[data-mode="bike"][aria-pressed="true"]{background:#14532d;border-color:#14532d;}
  .modebtn[data-mode="walk"][aria-pressed="true"]{background:#a16207;border-color:#a16207;}
  #showrow{display:flex;align-items:flex-start;gap:8px;padding:2px 12px 8px;background:#faf7f0;border-bottom:1px solid #e7e2d6;}
  .showlbl{flex:0 0 auto;margin-top:8px;font-size:10px;font-weight:800;letter-spacing:.45px;text-transform:uppercase;color:#b45309;}
  #catwrap{flex:1;min-width:0;display:flex;flex-wrap:wrap;gap:6px;padding:0;border:none;}
  #whatchange{flex:0 0 auto;margin-top:4px;background:none;border:none;color:#0f766e;font:inherit;font-size:13px;font-weight:700;cursor:pointer;padding:6px 0 6px 4px;white-space:nowrap;}
  .chip{border:1.5px solid #c4bba8;background:#fff;color:#374151;border-radius:999px;padding:6px 10px;font:inherit;font-size:13px;font-weight:700;cursor:pointer;}
  .chip[aria-pressed="true"]{background:var(--chip,#0f766e);border-color:var(--chip,#0f766e);color:#fff;}
  .chip.scope{--chip:#b45309;}
  .chip .chx{margin-left:4px;border:none;background:transparent;color:inherit;opacity:.7;font:inherit;font-size:16px;line-height:1;padding:0 1px;cursor:pointer;}
  .chip .chx:hover{opacity:1;}
  html.mode-bike #showrow, html.mode-walk #showrow{display:none;}
  #installbar{display:none;align-items:center;gap:10px;padding:8px 12px;background:#ecfdf5;border-bottom:1px solid #bbf7d0;color:#14532d;}
  #installbar.show{display:flex;}
  #installbar p{margin:0;flex:1;min-width:0;font-size:13px;font-weight:600;line-height:1.35;}
  #installbar .cact{flex:0 0 auto;}
  #installbar .cbtn{font-size:12px;padding:7px 11px;}
  #towns{position:absolute;inset:0;z-index:4;pointer-events:none;}
  .townmark{position:absolute;transform:translate(-50%,-50%);pointer-events:auto;cursor:pointer;touch-action:manipulation;z-index:7;border:none;background:none;padding:0;font:inherit;}
  .townmark .tlab{display:block;font-size:15px;font-weight:800;color:#0f766e;background:rgba(255,252,245,.96);border:1.5px solid #0f766e;padding:7px 12px;border-radius:999px;box-shadow:0 2px 8px rgba(0,0,0,.18);white-space:nowrap;}
  .townmark[aria-pressed="true"] .tlab{background:#0f766e;color:#fff;}
  #stage{flex:1 1 auto;min-height:0;position:relative;display:flex;align-items:center;justify-content:center;background:#d4cbb3;overflow:hidden;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;}
  #mapfit{position:absolute;inset:0;overflow:hidden;--pin-scale:1;--lbl-opacity:1;--town-opacity:0;--pin-screen:1;--pin-labels:0;--lastmile-opacity:0;}
  #mapfit svg{display:block;width:100%;height:100%;}
  #mapzoom{position:absolute;right:10px;bottom:10px;z-index:5;display:flex;flex-direction:column;gap:6px;}
  #mapzoom button{width:36px;height:36px;border:none;border-radius:8px;background:#fff;color:#0f766e;font-size:20px;font-weight:700;line-height:1;box-shadow:0 2px 8px rgba(0,0,0,.22);cursor:pointer;font-family:inherit;}
  #mapzoom button:disabled{opacity:.35;cursor:default;}
  #pins{position:absolute;inset:0;z-index:2;}
  #clusters{position:absolute;inset:0;z-index:3;pointer-events:none;}
  .cluster{position:absolute;transform:translate(-50%,-100%);pointer-events:auto;cursor:pointer;touch-action:manipulation;z-index:7;}
  .cluster .cbadge{min-width:44px;height:44px;padding:0 10px;border-radius:999px;background:#0f766e;color:#fff;font-weight:800;font-size:18px;border:3px solid #fff;box-shadow:0 2px 8px rgba(0,0,0,.3);display:flex;align-items:center;justify-content:center;}
  .cluster .plab{left:50%;top:100%;transform:translate(-50%,6px);opacity:1;pointer-events:none;font-size:13px;}
  .clist{display:flex;flex-direction:column;gap:6px;margin:2px 0 0;}
  .clist-sec{margin:14px 0 6px;font-size:13px;font-weight:800;letter-spacing:.3px;text-transform:uppercase;color:#0f766e;}
  .clist-sec:first-child{margin-top:4px;}
  .crow{display:block;width:100%;border:1px solid #e7e2d6;background:#fff;padding:12px 12px;border-radius:12px;font:inherit;text-align:left;cursor:pointer;}
  .crow:active,.crow:hover{background:#f8faf9;border-color:#c5ddd8;}
  .crow-name{display:block;font-size:17px;font-weight:700;color:#243;line-height:1.25;}
  .crow-desc{display:block;margin-top:4px;font-size:14.5px;font-weight:500;color:#4b5563;line-height:1.4;}
  .crow-host{display:inline-block;margin-top:6px;font-size:12.5px;font-weight:700;color:#b45309;}
  .cmeta{font-size:12px;color:#6b7280;margin-left:auto;}
  #yarn,#leads,#leaddots{position:absolute;inset:0;z-index:1;pointer-events:none;overflow:visible;}
  #yarn path{fill:none;stroke:#a21caf;stroke-width:1.1;stroke-linecap:round;stroke-dasharray:2.2 1.8;filter:drop-shadow(0 1px 1px rgba(0,0,0,.25));}
  #leads path.lead-halo{fill:none;stroke:#fff;stroke-width:1.55;stroke-linecap:round;opacity:.92;}
  #leads path.lead{fill:none;stroke:#2563eb;stroke-width:0.72;stroke-linecap:round;opacity:.95;}
  .leaddot{position:absolute;width:11px;height:11px;margin:-5.5px 0 0 -5.5px;border-radius:50%;background:#2563eb;border:2px solid #fff;box-shadow:0 0 0 1px rgba(37,99,235,.45),0 1px 3px rgba(0,0,0,.28);pointer-events:none;}
  #yarn path.draw{animation:yarnin .4s ease-out;}
  @keyframes yarnin{from{opacity:0}to{opacity:1}}
  .pin.picked .bub{box-shadow:0 0 0 3px #fff,0 0 0 6px #a21caf,0 2px 5px rgba(0,0,0,.35);}
  .pin.picked{z-index:4;}
  #pins.finding .pin{opacity:.38;transition:opacity .2s;}
  #pins.finding .pin.picked,#pins.finding .pin.irish-lit{opacity:1;}
  .pin.irish-lit{z-index:5;}
  .pin.irish-lit .bub{box-shadow:0 0 0 3px #fff,0 0 0 7px #14532d,0 0 14px rgba(20,83,45,.55);}
  @keyframes irishpulse{50%{box-shadow:0 0 0 3px #fff,0 0 0 10px #166534,0 0 18px rgba(20,83,45,.7);}}
  .pin.irish-lit .bub{animation:irishpulse 1.3s ease-in-out infinite;}
  .pin{position:absolute;transform:translate(-50%,-100%) scale(var(--pin-screen,1));transform-origin:50% 100%;cursor:pointer;touch-action:manipulation;}
  .pin .bub{width:28px;height:28px;border-radius:50% 50% 50% 3px;transform:rotate(45deg);border:2px solid #fff;box-shadow:0 2px 5px rgba(0,0,0,.35);display:flex;align-items:center;justify-content:center;}
  .pin .bub span{transform:rotate(-45deg);font-size:13px;line-height:1;}
  .pin.revealed{z-index:8;}
  .pin.revealed .plab{opacity:1 !important;}
  .pin.home-pin{z-index:6;}
  .pin.home-pin .bub{width:36px;height:36px;}
  .pin.home-pin .bub span{font-size:17px;}
  .pin .st{position:absolute;top:-6px;right:-7px;width:14px;height:14px;border-radius:50%;background:#f59e0b;color:#fff;font-size:9px;line-height:14px;text-align:center;border:1.5px solid #fff;}
  .pin .plab,.cluster .plab{position:absolute;font-size:11px;font-weight:700;color:#243;background:rgba(255,252,245,.96);border:1px solid rgba(91,78,52,.2);padding:2px 6px;border-radius:4px;white-space:nowrap;pointer-events:none;opacity:var(--pin-labels,0);box-shadow:0 1px 2px rgba(0,0,0,.12);line-height:1.2;}
  #mapfit.show-pin-labels .pin .plab{pointer-events:auto;cursor:pointer;}
  .pin.lab-s .plab{left:50%;top:100%;transform:translate(-50%,5px) scale(calc(1 / var(--pin-screen,1)));transform-origin:50% 0;}
  .pin.lab-n .plab{left:50%;top:0;transform:translate(-50%,calc(-100% - 8px)) scale(calc(1 / var(--pin-screen,1)));transform-origin:50% 100%;}
  .pin.lab-e .plab{left:100%;top:8px;transform:translate(6px,-50%) scale(calc(1 / var(--pin-screen,1)));transform-origin:0 50%;}
  .pin.lab-w .plab{left:0;top:8px;transform:translate(calc(-100% - 6px),-50%) scale(calc(1 / var(--pin-screen,1)));transform-origin:100% 50%;}
  .pin.lab-ne .plab{left:100%;top:0;transform:translate(5px,calc(-100% - 2px)) scale(calc(1 / var(--pin-screen,1)));transform-origin:0 100%;}
  .pin.lab-nw .plab{left:0;top:0;transform:translate(calc(-100% - 5px),calc(-100% - 2px)) scale(calc(1 / var(--pin-screen,1)));transform-origin:100% 100%;}
  .pin.lab-se .plab{left:100%;top:100%;transform:translate(5px,4px) scale(calc(1 / var(--pin-screen,1)));transform-origin:0 0;}
  .pin.lab-sw .plab{left:0;top:100%;transform:translate(calc(-100% - 5px),4px) scale(calc(1 / var(--pin-screen,1)));transform-origin:100% 0;}
  .note{flex:0 0 auto;padding:8px 14px calc(8px + env(safe-area-inset-bottom));font-size:12px;color:#556;background:#faf7f0;border-top:1px solid #e7e2d6;max-height:4.8em;overflow-y:auto;}
  .note b{color:#243;}
  #card{position:fixed;left:0;right:0;bottom:0;z-index:100;background:#fff;border-radius:16px 16px 0 0;box-shadow:0 -4px 22px rgba(0,0,0,.22);padding:0 16px calc(env(safe-area-inset-bottom) + 18px);transform:translateY(115%);transition:transform .25s;max-height:min(78dvh,640px);overflow:hidden;display:flex;flex-direction:column;}
  #card.open{transform:translateY(0);}
  #card.no-anim{transition:none;}
  #card.journey{max-height:min(72dvh,640px);}
  #card.dragging{transition:none;}
  .csheet{flex:0 0 auto;display:flex;align-items:center;justify-content:center;padding:10px 0 8px;cursor:grab;touch-action:none;}
  .csheet i{display:block;width:40px;height:5px;border-radius:999px;background:#d1d5db;}
  #cardbody{flex:1 1 auto;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;}
  #card.journey #cardbody{overflow-x:hidden;overflow-y:auto;display:flex;flex-direction:column;}
  #card.journey #cardbody .irishbox{flex:1 1 auto;min-height:48px;overflow-y:auto;-webkit-overflow-scrolling:touch;}
  #card.journey #cardbody .hopedit{flex:0 0 auto;}
  #card .x{position:absolute;top:8px;right:12px;z-index:2;font-size:20px;color:#889;cursor:pointer;line-height:1;}
  .ct{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:6px;}
  .ctag{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.4px;color:#fff;padding:2px 8px;border-radius:999px;}
  .chost{background:#fde68a;color:#7c5c00;}
  .cname{font-size:16px;font-weight:700;margin:2px 0 4px;padding-right:22px;}
  .cplan{margin:0 0 8px;padding:7px 9px;background:#fff7ed;border-left:3px solid #ea580c;border-radius:0 6px 6px 0;color:#7c2d12;font-size:12.5px;font-weight:600;}
  .cdesc{margin:0 0 6px;font-size:13.5px;line-height:1.45;color:#374151;}
  .cinfo{margin:0 0 10px;font-size:12px;color:#6b7280;}
  .cact{display:flex;gap:8px;flex-wrap:wrap;}
  .cbtn{text-decoration:none;font-weight:600;font-size:12.5px;padding:8px 13px;border-radius:8px;border:none;font-family:inherit;cursor:pointer;display:inline-block;}
  .cdir{background:#0f766e;color:#fff;}
  .cgoog{background:#eef2ff;color:#3730a3;border:1px solid #c7d2fe;}
  .ccall{background:#e6f4ea;color:#166534;border:1px solid #b7e0c4;}
  .cedit,.ccancel{background:#f3f4f6;color:#374151;border:1px solid #d1d5db;}
  .cdel{background:#fef2f2;color:#b91c1c;border:1px solid #fecaca;}
  .csave{background:#0f766e;color:#fff;cursor:pointer;}
  .cbtn.wide{flex:1 1 100%;text-align:center;padding:12px 14px;font-size:14px;}
  .cbtn.cprimary{background:#0f766e;color:#fff;}
  .cbtn.csecondary{background:#fff;color:#0f766e;border:1.5px solid #0f766e;}
  .cbtn:disabled{opacity:.55;cursor:default;}
  .csub{display:block;font-weight:500;font-size:12px;opacity:.88;margin-top:3px;}
  .chint{margin:12px 0 0;font-size:12.5px;color:#6b7280;line-height:1.45;}
  .cirish{background:#14532d;color:#fef9c3;border:none;}
  .irishbox{margin:10px 0 0;padding:10px 12px;background:#f0fdf4;border-radius:10px;border:1px solid #bbf7d0;}
  .irishbox p{margin:0 0 8px;font-size:14px;line-height:1.45;color:#14532d;}
  .irishbox p:last-child{margin:0;}
  .irishbox .who{font-size:11px;font-weight:700;letter-spacing:.4px;text-transform:uppercase;color:#166534;margin:0 0 8px;}
  .field{margin:0 0 10px;}
  .field label{display:block;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.4px;color:#6b7280;margin-bottom:4px;}
  .field input,.field textarea,.field select{width:100%;border:1.5px solid #d8d2c4;border-radius:8px;padding:8px 10px;font:inherit;font-size:14px;color:#243;background:#fff;}
  .field textarea{min-height:72px;resize:vertical;}
  .hopedit{margin:10px 0 0;}
  .hopedit textarea{min-height:52px;font-size:14px;}
  .hopread{margin:10px 0 0;}
  .otherway{margin:8px 0 0;font-size:12.5px;line-height:1.4;color:#14532d;}
  .otherway b{font-weight:700;}
  .drafthint{margin:0 0 8px;font-size:12.5px;font-weight:600;color:#b45309;}
  .pinhow{display:flex;}
  .pinhow .modebtn{padding:8px 4px;font-size:13px;}
  #toast{position:fixed;left:12px;right:12px;bottom:calc(env(safe-area-inset-bottom) + 16px);z-index:200;background:#1f2937;color:#fff;padding:10px 14px;border-radius:10px;font-size:13px;line-height:1.4;box-shadow:0 4px 16px rgba(0,0,0,.25);display:none;}
  #toast.show{display:block;}
  .lastmile .who,#lastmile .who{font-size:11px;font-weight:700;letter-spacing:.4px;text-transform:uppercase;color:#c2410c;margin:0 0 8px;}
  #lastmile p,.lastmile p{margin:0 0 8px;font-size:13.5px;line-height:1.45;color:#7c2d12;}
  #lastmile p:last-child,.lastmile p:last-child{margin:0;}
  #card.lastmile-open{overflow:hidden;}
  #lastmile{display:none;position:absolute;inset:0;z-index:4;background:#fffaf5;border-radius:16px 16px 0 0;padding:14px 16px calc(env(safe-area-inset-bottom) + 18px);overflow-y:auto;}
  #lastmile.show{display:block;}
  .lm-link{display:inline-block;margin:12px 0 0;background:none;border:none;padding:0;font:inherit;font-size:13.5px;font-weight:700;color:#c2410c;text-decoration:underline;text-underline-offset:3px;cursor:pointer;text-align:left;}
  #lastmile .lm-steps{margin:0 0 14px;padding:0 0 0 1.2em;color:#7c2d12;}
  #lastmile .lm-steps li{margin:0 0 8px;font-size:14.5px;line-height:1.45;font-weight:600;}
  #lastmile .lm-steps li:last-child{margin:0 0 2px;}
  #lastmile .lm-meta{margin:0 0 10px;font-size:12px;color:#9a3412;}
  #mapfit.show-lastmile .lastmile-route{opacity:.92;}
  #mapfit.drive-mode .nroad-line{stroke-width:calc(10.2 * var(--pin-scale,1));}
  #mapfit.drive-mode .greenway,#mapfit.drive-mode .greenway-dash{opacity:.38;}
  #mapfit.drive-mode .walkway{opacity:.28;}
  #mapfit.bike-mode .greenway{stroke:#dc2626;stroke-width:calc(9 * var(--pin-scale,1));stroke-dasharray:none;}
  #mapfit.bike-mode .greenway-dash{stroke-width:calc(3.4 * var(--pin-scale,1));opacity:1;}
  #mapfit.bike-mode .walkway{opacity:.28;}
  #mapfit.walk-mode .walkway{stroke:#eab308;stroke-width:calc(6.2 * var(--pin-scale,1));opacity:1;}
  #mapfit.show-walks .walkway{stroke:#eab308;stroke-width:calc(6.4 * var(--pin-scale,1));opacity:1;}
  #mapfit.walk-mode .greenway,#mapfit.walk-mode .greenway-dash{opacity:.4;}
  .gw-seg{fill:none;stroke:#eab308;stroke-width:calc(5.2 * var(--pin-scale,1));stroke-linecap:round;stroke-linejoin:round;opacity:0;}
  #mapfit .gw-seg.on{opacity:.95;}
  .pin.gw-pin .bub{background:#15803d;}
  .pin.rental-pin .bub{background:#ca8a04;}
  .pin.walk-pin .bub{background:#a16207;}
  .cbtn.cbike{background:#14532d;color:#fefce8;}
  .cbtn.cwalk{background:#a16207;color:#fffbeb;}
  .walkloops{margin:0 0 10px;padding:8px 10px;background:#fffbeb;border:1px solid #fde68a;border-radius:10px;}
  .walkloops p{margin:0 0 6px;font-size:13px;line-height:1.4;color:#7c4a03;}
  .walkloops p:last-child{margin:0;}
  .walkloops .who{font-size:11px;font-weight:700;letter-spacing:.4px;text-transform:uppercase;color:#a16207;margin:0 0 8px;}
  #loading{padding:40px 20px;text-align:center;color:#889;}
  #help{display:none;position:fixed;inset:0;z-index:300;background:#faf7f0;padding:calc(env(safe-area-inset-top) + 18px) 20px calc(env(safe-area-inset-bottom) + 18px);overflow-y:auto;}
  #help.show{display:flex;flex-direction:column;}
  #help .helpinner{flex:1;display:flex;flex-direction:column;max-width:420px;margin:0 auto;width:100%;min-height:100%;position:relative;}
  #help .helpstep{font-size:11px;font-weight:800;letter-spacing:.45px;text-transform:uppercase;color:#0f766e;margin:0;}
  #help h2{margin:8px 0 12px;font-size:26px;line-height:1.2;color:#243;}
  #help .helpbody{margin:0 0 14px;font-size:18px;line-height:1.5;color:#374151;}
  #help .helpbody:last-of-type{margin-bottom:16px;}
  #help .helpletter p{margin:0 0 14px;font-size:18px;line-height:1.5;color:#374151;}
  #help .helpletter p:last-of-type{margin-bottom:12px;}
  #help .helpname{margin:0 0 10px;}
  #help .helpname label{margin-bottom:6px;}
  #help .helpgate{margin:8px 0 16px;padding:14px 14px 6px;background:#fff;border:1.5px solid #e7e2d6;border-radius:14px;}
  #help .helpgate .helpbody{margin:0 0 12px;font-size:17px;}
  #help .helpfig{background:#fff;border:1.5px solid #e7e2d6;border-radius:14px;padding:16px 14px;margin:0 0 20px;}
  #help .helpfig svg{display:block;width:100%;height:auto;}
  #help .helptown{display:inline-block;font-size:16px;font-weight:800;color:#0f766e;background:rgba(255,252,245,.96);border:1.5px solid #0f766e;padding:8px 14px;border-radius:999px;}

<script>
// Visual style per category (labels + places come from data/places.json)
const STYLE={home:{color:"#e11d48"},food:{color:"#ea580c"},shop:{color:"#16a34a"},beach:{color:"#0284c7"},do:{color:"#7c3aed"},golf:{color:"#0d9488"},landmarks:{color:"#78716c"},family:{color:"#db2777"}};
const CAT_EMOJI={home:"🏡",food:"🍽️",shop:"🛒",beach:"🏖️",do:"🎡",golf:"⛳",landmarks:"🗿",family:"📍"};
// projection MUST match the basemap generator
const W=1100, H=1545.0, lngMin=-10.35, lngMax=-8.95, latMin=53.2, latMax=54.36;
const pxPerDegLng=W/(lngMax-lngMin), pxPerDegLat=H/(latMax-latMin);
const proj=(lng,lat)=>[(lng-lngMin)*pxPerDegLng,(latMax-lat)*pxPerDegLat];
const unproj=(x,y)=>({lng:lngMin+(x/W)*(lngMax-lngMin), lat:latMax-(y/H)*(latMax-latMin)});

const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const nowIso=()=>new Date().toISOString();
const uuid=()=>(crypto.randomUUID?crypto.randomUUID():('p-'+Date.now()+'-'+Math.random().toString(16).slice(2)));

(function stripRefreshParam(){
  const u=new URL(location.href);
  if(!u.searchParams.has('_r')) return;
  u.searchParams.delete('_r');
  history.replaceState({},'',u.pathname+u.search+u.hash);
})();

function fitMap(){
  if(window.MapNav) MapNav.onFit();
}
window.addEventListener('resize', fitMap);
if(window.visualViewport) visualViewport.addEventListener('resize', fitMap);
window.addEventListener('orientationchange', ()=>setTimeout(fitMap, 250));
function fitSoon(){ fitMap(); requestAnimationFrame(fitMap); setTimeout(fitMap, 50); setTimeout(fitMap, 300); }

let CATS={}, CURATED=[], PLACES=[], IRISH={};
let showPinLabels=true;
let mode='drive', GREENWAY={samples:[]};
let catFilters=[], areaFilter=null, lookTown=null, searchQ='';
let whatOpen=false;
let listKind=null, lastListPlaces=null, lastListTitle='';
let resultView='map';
let spiderOpen=null;
const TOWNS=[
  {id:'newport', name:'Newport', lat:53.8869, lng:-9.5453},
  {id:'westport', name:'Westport', lat:53.8007, lng:-9.5355},
  {id:'mulranny', name:'Mulranny', lat:53.906, lng:-9.777},
  {id:'achill', name:'Achill', lat:53.93145, lng:-9.92425, aliases:['achill sound','achill island']},
  {id:'louisburgh', name:'Louisburgh', lat:53.762, lng:-9.770},
  {id:'murrisk', name:'Murrisk', lat:53.76, lng:-9.658, aliases:['reek','croagh patrick']}
];
const SEARCH_AREAS=[
  {id:'here', label:'Near the house', aliases:['near the house','near house','around here','nearby','from the house']},
  {id:'to-achill', label:'On the way to Achill', aliases:['on the way to achill','to achill','towards achill','toward achill']}
];
const CAT_CHIPS=[
  {id:'beach', label:'Beaches'},
  {id:'food', label:'Food'},
  {id:'shop', label:'Shops'},
  {id:'do', label:'To do'},
  {id:'landmarks', label:'Landmarks'},
  {id:'golf', label:'Golf'}
];
const PIN_CATS=CAT_CHIPS.concat([{id:'family', label:'Our pins'}]);
const BUILT_CAT=new Set(PIN_CATS.map(c=>c.id).concat(['home','all','bike','walk','rental','greenway','family-bike']));
const CUSTOM_COLORS=['#0f766e','#b45309','#7c3aed','#be185d','#0369a1'];
function catStyle(id){
  if(STYLE[id]) return STYLE[id];
  let h=0;
  const s=String(id||'');
  for(let i=0;i<s.length;i++) h=(h*31+s.charCodeAt(i))>>>0;
  return {color:CUSTOM_COLORS[h%CUSTOM_COLORS.length]};
}
function slugCat(label){
  const s=String(label||'').toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-+|-+$/g,'').slice(0,24);
  return s||'family';
}
function customCats(){
  const seen=new Map();
  driveFamilyPins().forEach(p=>{
    if(!p||!p.cat||BUILT_CAT.has(p.cat)) return;
    if(!seen.has(p.cat)) seen.set(p.cat,{id:p.cat, label:p.catLabel||CATS[p.cat]||p.cat, emoji:p.emoji||'📍'});
  });
  return [...seen.values()];
}
function pinCatList(){
  return PIN_CATS.concat(customCats().filter(c=>!PIN_CATS.some(x=>x.id===c.id)));
}
const AREA_CORRIDOR={ 'to-achill':['here','mulranny','achill'] };
let HOME=null;
const pinsEl=document.getElementById('pins'), offEl=document.getElementById('offmap');
let pinNodes=[];
let picked=[];
let irishLit=new Set();
let hopDraft=null;
let hopWriting=false;
let hopEditing=false;
let revealedId=null;
const IRISH_FROM={};
const toastEl=document.getElementById('toast');
let toastTimer=null;

function toast(msg){
  toastEl.textContent=msg; toastEl.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer=setTimeout(()=>toastEl.classList.remove('show'), 4200);
}
function hideToast(){ clearTimeout(toastTimer); toastEl.classList.remove('show'); }
function looksOffline(err){
  if(navigator.onLine===false) return true;
  const m=String(err&&err.message||err||'').toLowerCase();
  return /failed to fetch|networkerror|load failed|network request failed|internet connection appears to be offline/.test(m);
}
function cleanName(s){
  return String(s||'').replace(/[\u0000-\u001F\u007F]/g,'').replace(/\s+/g,' ').trim().slice(0,39);
}
function myName(){
  try{ return cleanName(localStorage.getItem('nn-my-name')||''); }catch(e){ return ''; }
}
function setMyName(s){
  const n=cleanName(s);
  try{ if(n) localStorage.setItem('nn-my-name', n); }catch(e){}
  return n;
}
function clanOk(){
  try{ return localStorage.getItem('nn-clan')==='1' && !!(localStorage.getItem('nn-trip')||'').trim(); }
  catch(e){ return false; }
}
function rememberClan(trip){
  try{
    localStorage.setItem('nn-clan','1');
    if(trip) localStorage.setItem('nn-trip', String(trip).trim());
  }catch(e){}
}
function isStandalone(){
  return window.matchMedia('(display-mode: standalone)').matches||window.navigator.standalone===true;
}
function tipOnce(key){
  try{
    if(localStorage.getItem('nn-tip-'+key)==='1') return false;
    localStorage.setItem('nn-tip-'+key,'1');
    return true;
  }catch(e){ return false; }
}

function placeArea(p){
  if(!p) return 'other';
  if(p.id==='lime-kiln-house') return 'here';
  const s=(p.id+' '+p.name).toLowerCase();
  if(/derrada|shore-walk|western-way|burrishoole/.test(s)) return 'here';
  if(/achill|keel|doogort|keem|kildavnet/.test(s)) return 'achill';
  if(/mulranny|rosturk|tiernaur|nevin/.test(s)) return 'mulranny';
  if(/louisburgh|killeen|kiladoon|carrowniskey|old-head|old head|roonagh|doolough/.test(s)) return 'louisburgh';
  if(/murrisk|croagh|bertra/.test(s)) return 'murrisk';
  if(/castlebar|museum-of-country|ballintubber/.test(s)) return 'castlebar';
  if(/galway/.test(s)) return 'galway';
  if(/carne|belmullet|enniscrone/.test(s)) return 'north';
  if(/westport|kilmeena|rosbeg|sheebeen|shebeen|pirate-adventure/.test(s)) return 'westport';
  if(/newport|darragh|clew-bay-fishing/.test(s)) return 'newport';
  return 'other';
}
function inArea(p, key){
  const area=placeArea(p);
  const corridor=AREA_CORRIDOR[key];
  if(corridor) return corridor.includes(area);
  return area===key;
}
function driveListed(p){
  if(!p || p.id==='lime-kiln-house') return false;

function clusterTitle(places){
  const towns=places.map(p=>{
    const n=String(p.name||''), id=String(p.id||'');
    if(/westport/i.test(n+id)) return 'Westport';
    if(/newport/i.test(n+id)) return 'Newport';
    if(/mulranny/i.test(n+id)) return 'Mulranny';
    if(/louisburgh|killeen|kiladoon|carrowniskey|old head/i.test(n+id)) return 'Louisburgh';
    if(/achill|keel|doogort/i.test(n+id)) return 'Achill';
    const bit=n.split(',')[1];
    return bit?bit.trim():'';
  }).filter(Boolean);
  const counts={};
  towns.forEach(t=>{ counts[t]=(counts[t]||0)+1; });
  const top=Object.entries(counts).sort((a,b)=>b[1]-a[1])[0];
  if(top && top[1]>=Math.ceil(places.length/2)) return top[0];
  return places.length+' places';
}

}

function clearClusters(){

  if(host) host.replaceChildren();

function groupSpan(g){
  let minX=g[0].x, maxX=g[0].x, minY=g[0].y, maxY=g[0].y;
  g.forEach(n=>{
    minX=Math.min(minX,n.x); maxX=Math.max(maxX,n.x);
    minY=Math.min(minY,n.y); maxY=Math.max(maxY,n.y);
  });
  return Math.hypot(maxX-minX, maxY-minY);
}
function spiderPins(g, px){
  const n=g.length;
  const cx=g.reduce((s,node)=>s+node.x,0)/n;
  const cy=g.reduce((s,node)=>s+node.y,0)/n;
  const chord=36/px;
  const r=n===2 ? chord/2 : Math.max(4, chord/(2*Math.sin(Math.PI/n)));
  g.forEach((node,i)=>{
    const a=-Math.PI/2 + (i*2*Math.PI)/n;
    node.dx=cx+Math.cos(a)*r;
    node.dy=cy+Math.sin(a)*r;
    node.el._clustered=false;
  });
}
function layoutPinPositions(){
  pinNodes.forEach(n=>{
    n.dx=n.x; n.dy=n.y;
    n.el._clustered=false;
    n.el.classList.remove('lab-n','lab-s','lab-e','lab-w','lab-ne','lab-nw','lab-se','lab-sw');
    n.el.classList.add('lab-s');
    n.el.classList.toggle('revealed', n.el.dataset.id===revealedId);
    n.el.style.zIndex='';
  });
  clearClusters();
  const svg=document.getElementById('basemap');
  const fit=document.getElementById('mapfit');
  const host=document.getElementById('clusters');
  if(!svg||!fit||!host||!window.MapNav) return;
  const vb=svg.viewBox && svg.viewBox.baseVal;
  if(!vb || !(vb.width>0)) return;
  const px=Math.max(1, fit.clientWidth/Math.max(0.001, vb.width));
  const ps=(window.MapNav&&MapNav.getPinScreen())||1;
  const minD=(48*ps)/px;
  const vis=pinNodes.filter(n=>!n.el._hidden && !n.el.classList.contains('home-pin') && n.el.dataset.id!==revealedId);
  const parent=vis.map((_,i)=>i);
  const find=i=>parent[i]===i?i:(parent[i]=find(parent[i]));
  for(let i=0;i<vis.length;i++){
    for(let j=i+1;j<vis.length;j++){
      const dx=vis[i].x-vis[j].x, dy=vis[i].y-vis[j].y;
      if(dx*dx+dy*dy<minD*minD){ const a=find(i), b=find(j); if(a!==b) parent[a]=b; }
    }
  }
  const groups={};
  vis.forEach((n,i)=>{ const r=find(i); (groups[r]=groups[r]||[]).push(n); });
  Object.values(groups).forEach(g=>{
    if(g.length<2) return;
    g.sort((a,b)=>String(a.el.dataset.id).localeCompare(String(b.el.dataset.id)));
    const places=g.map(n=>PLACES.find(p=>p.id===n.el.dataset.id)).filter(Boolean);
    if(places.length<2) return;
    // Same street / stacked coords: fan them out so the map is tappable.
    const forced=spiderOpen && g.some(n=>spiderOpen.has(n.el.dataset.id));
    if((px>=8 && groupSpan(g)<minD) || (forced && px>=3.5)){
      spiderPins(g, Math.max(px, 4));
      return;
    }
    g.forEach(n=>{ n.el._clustered=true; });
    const cx=g.reduce((sum,n)=>sum+n.x,0)/g.length;
    const cy=g.reduce((sum,n)=>sum+n.y,0)/g.length;
    const el=document.createElement('div');
    el.className='cluster';
    el.innerHTML=`<div class="cbadge">${places.length}</div><div class="plab">${esc(clusterTitle(places))}</div>`;
    let tapped=false;
    const expand=e=>{
      if(e){ e.preventDefault(); e.stopPropagation(); }
      if(tapped) return;
      tapped=true;
      setTimeout(()=>{ tapped=false; }, 400);
      if(resultView==='map'){
        spiderOpen=new Set(places.map(p=>p.id));
        if(window.MapNav) MapNav.fitPoints(places);
        positionPins();
        return;
      }
      if(!resultSet()) rememberList('cluster', places, clusterTitle(places));
      openCluster(places);
    };
    el.addEventListener('pointerup', expand);
    el.addEventListener('click', expand);
    const pct=MapNav.pinPct(cx, cy);
    el.style.left=pct.left; el.style.top=pct.top;
    host.appendChild(el);
  });
}

function normQ(s){ return String(s||'').toLowerCase().replace(/[’']/g,"'").trim(); }
function matchArea(q){
  const n=normQ(q);
  if(n.length<4) return null;
  return SEARCH_AREAS.find(a=>a.label.toLowerCase()===n || (a.aliases||[]).some(al=>al===n || n.startsWith(al) || al.startsWith(n)))||null;
}
function matchTown(q){
  const n=normQ(q);
  if(n.length<3) return null;
  const hit=TOWNS.find(t=>{
    const name=t.name.toLowerCase();
    if(name===n || t.id===n) return true;
    if(name.startsWith(n) || n.startsWith(name)) return n.length>=4 || name===n;
    return (t.aliases||[]).some(a=>a===n || a.startsWith(n) || n.startsWith(a));
  });
  return hit||null;
}
function placeMatches(p, q){
  const n=normQ(q);
  const blob=normQ([p.id,p.name,p.desc,p.long,p.info,p.plan,CATS[p.cat]].join(' '));
  if(blob.includes(n)) return true;
  if(n==='pub' || n==='pubs') return /pub|bar|tavern|shebeen|sheebeen/.test(blob);
  if(n==='pharmacy' || n==='chemist') return /pharmacy|chemist/.test(blob);
  if(n==='beach' || n==='beaches') return p.cat==='beach' || blob.includes('beach');
  if(n==='golf') return p.cat==='golf' || blob.includes('golf');
  if(n==='shop' || n==='shops' || n==='supermarket') return p.cat==='shop';
  if(n==='petrol' || n==='fuel' || n==='diesel') return /petrol|circle k|fuel/.test(blob);
  return false;
}
function matchPlaces(q){
  return PLACES.filter(p=>placeMatches(p, q));

function runSearch(raw, opts){
  searchQ=String(raw||'').trim();
  const minLen=(opts&&opts.force)?2:3;
  if(searchQ.length<minLen){
    if(listKind==='search') closeCard({clearList:true});
    resultView='map';
    refresh();
    return;
  }
  catFilters=[];
  areaFilter=null;
  whatOpen=false;
  const area=matchArea(searchQ);
  if(area){
    areaFilter=area.id;
    const places=placesInArea(area.id);
    if(!places.length){
      rememberList('search', [], area.label);
      refresh();
      toast('Nothing listed for '+area.label+' yet.');
      return;
    }
    showBrowseResults('area', places, area.label);
    return;
  }
  const town=matchTown(searchQ);
  if(town){
    openTown(town);
    return;
  }
  const places=matchPlaces(searchQ);
  if(!places.length){
    rememberList('search', [], searchQ);
    refresh();
    toast('Nothing matching “'+searchQ+'”. Try a town or a name.');
    return;
  }
  if(places.length===1){
    rememberList(null, null, '');
    refresh();
    showPlaceFromList(places[0]);
    return;
  }
  showBrowseResults('search', places, '“'+searchQ+'”');
}

(function sheetDrag(){

  const maxH=()=>window.innerHeight*(card.classList.contains('journey')?0.72:0.78);

  const onMove=e=>{

  };

    card.classList.remove('dragging');
    try{ handle.releasePointerCapture(e.pointerId); }catch(err){}
  };
  handle.addEventListener('pointerdown', e=>{

    e.preventDefault();
    dragging=true;
    startY=e.clientY;
    startH=card.getBoundingClientRect().height;
    card.classList.add('dragging');
    handle.setPointerCapture(e.pointerId);
  });
  handle.addEventListener('pointermove', onMove);

function nearestGwSample(p){
  const s=GREENWAY.samples||[];
  let best=0, bestD=Infinity;
  for(let i=0;i<s.length;i++){
    const d=(s[i].lat-p.lat)**2+(s[i].lng-p.lng)**2;
    if(d<bestD){ bestD=d; best=i; }
  }
  return best;
}
function gwSegPath(a,b){
  const s=GREENWAY.samples||[];
  if(s.length<2) return '';
  let i=nearestGwSample(a), j=nearestGwSample(b);
  if(i===j) return '';
  if(i>j){ const t=i; i=j; j=t; }
  const pts=s.slice(i,j+1);
  return pts.map((pt,k)=>{
    const [x,y]=proj(pt.lng,pt.lat);
    return (k?'L':'M')+' '+x.toFixed(1)+','+y.toFixed(1);
  }).join(' ');
}

function paintYarn(animate){
  const path=document.getElementById('yarnpath');
  if(!path) return;
  if(picked.length===2 && isGwStop(picked[0]) && isGwStop(picked[1])){
    path.setAttribute('d',''); path.classList.remove('draw');
    paintGwSeg(picked[0], picked[1]);
    return;
  }
  clearGwSeg();
  if(picked.length<2 || !window.MapNav){
    path.setAttribute('d',''); path.classList.remove('draw');
    return;
  }
  const [x1s,y1s]=proj(picked[0].lng,picked[0].lat);
  const [x2s,y2s]=proj(picked[1].lng,picked[1].lat);
  const a=MapNav.pinPct(x1s,y1s), b=MapNav.pinPct(x2s,y2s);
  const x1=parseFloat(a.left), y1=parseFloat(a.top);
  const x2=parseFloat(b.left), y2=parseFloat(b.top);
  const dx=x2-x1, dy=y2-y1, len=Math.hypot(dx,dy)||1;
  const bulge=Math.min(16, len*0.22);
  const cx=(x1+x2)/2 - dy/len*bulge;
  const cy=(y1+y2)/2 + dx/len*bulge;
  path.setAttribute('d', `M ${x1.toFixed(2)} ${y1.toFixed(2)} Q ${cx.toFixed(2)} ${cy.toFixed(2)} ${x2.toFixed(2)} ${y2.toFixed(2)}`);
  if(animate){
    path.classList.remove('draw');
    void path.getBoundingClientRect();
    path.classList.add('draw');
  }
}

function hopKeyOf(a,b){ return a.id+'>'+b.id; }
function hopOnSheet(a,b){

function cleanNotes(s){
  return String(s||'')
    .replace(/[\u0000-\u0008\u000B\u000C\u000E-\u001F\u007F\u202A-\u202E\u2066-\u2069]/g,'')
    .replace(/<[^>]{0,200}>/g,' ')
    .replace(/```+/g,'')
    .replace(/^\s*(system|assistant|user|developer|tool)\s*:/gim,'')
    .replace(/ignore (all |any |the )?(previous|prior|above|earlier) (instructions|prompts|rules)/gi,' ')
    .replace(/disregard (all |any |the )?(previous|prior|above) (instructions|prompts|rules)/gi,' ')
    .replace(/[ \t]{2,}/g,' ')
    .trim()
    .slice(0,400);
}
function sheetNotes(){
  const el=document.getElementById('hopnotes');

}
function hopText(hop){

function cancelHopEdit(a,b){
  if(hopWriting) return;
  const prior=hopDraft && hopDraft.key===hopKeyOf(a,b) && hopDraft.prior;
  if(hopDirty(a,b) && prior && prior.hop){
    if(prior.saved){
      hopDraft=null;
      hopEditing=false;
    } else {
      hopDraft={key:hopKeyOf(a,b), hop:prior.hop, dirty:true, notes:prior.hop.notes||'', prior:null};
      hopEditing=true;
    }
    showHopOnSheet(a,b, prior.hop);
    paintHopEditor(a,b);
    return;
  }
  if(hopDirty(a,b) || hopEditing){
    hopDraft=null;
    hopEditing=false;
    const saved=irishFor(a,b);
    if(saved){
      showHopOnSheet(a,b, saved);
      paintHopEditor(a,b);

async function generateIrish(a,b,notes){
  const have=hopOnSheet(a,b);
  const draft=(have&&Array.isArray(have.irish)?have.irish:[]).map(s=>cleanNotes(s)).filter(Boolean).slice(0,8);
  let r;
  try{
    r=await fetch('/api/irish',{
      method:'POST',
      headers:(window.FamilySync&&FamilySync.headers())||{'Content-Type':'application/json'},
      body:JSON.stringify({
        from:{id:a.id, name:a.name, lat:a.lat, lng:a.lng},
        to:{id:b.id, name:b.name, lat:b.lat, lng:b.lng},
        how:hopHow(),
        notes:cleanNotes(notes),
        draft
      })
    });
  }catch(err){
    if(looksOffline(err)) throw new Error('Irish consult is away from their desk. Try again later.');
    throw err;
  }
  const data=await r.json().catch(()=>({}));
  if(!r.ok){
    if(r.status===404) throw new Error('This phone is on an old server. Deploy, then tap Get latest.');
    throw new Error(data.error||'Could not write that hop.');
  }
  return data;
}
async function writeIrishDraft(a,b){
  if(hopWriting) return;
  const notes=sheetNotes();
  const before=hopText(hopOnSheet(a,b));
  setHopBusy(true);
  toast('Writing Irish directions…');
  try{
    const hop=await generateIrish(a,b,notes);
    hop.notes=notes;
    hop.draft=true;
    hopEditing=true;
    const existing=hopOnSheet(a,b);
    const committed=irishFor(a,b);
    hopDraft={
      key:hopKeyOf(a,b),
      hop,
      dirty:true,
      notes,
      prior: existing ? {
        hop:existing,
        saved:!!(committed && hopText(committed)===hopText(existing))
      } : null
    };
    const info=body.querySelector('.cinfo');
    if(info) info.textContent=`${hop.mins} min ${hop.how} · ${hop.km} km`;
    paintIrishBox(hop);
    lightHopMarks(hop);
    frameIrishPair(a,b);
    toast(hopText(hop)===before
      ? 'Same hop — add a note if you want it different.'
      : 'Draft ready. Save to put it in the app.');
  }catch(err){
    toast((err&&err.message)||'Could not write that hop.');
  }finally{
    setHopBusy(false);
    paintHopEditor(a,b);
  }
}
async function saveIrishHop(a,b){

function metresBetween(aLat,aLng,bLat,bLng){
  const R=6371000, toR=x=>x*Math.PI/180;
  const dLat=toR(bLat-aLat), dLng=toR(bLng-aLng);
  const s=Math.sin(dLat/2)**2+Math.cos(toR(aLat))*Math.cos(toR(bLat))*Math.sin(dLng/2)**2;
  return 2*R*Math.asin(Math.min(1,Math.sqrt(s)));
}
function nearbyPlace(lat,lng,exceptId){
  let best=null, bestD=Infinity;
  PLACES.forEach(p=>{
    if(!p||p.deleted||p.id===exceptId||p.lat==null||p.lng==null) return;
    const d=metresBetween(lat,lng,p.lat,p.lng);
    if(d<50 && d<bestD){ bestD=d; best=p; }
  });
  return best?{place:best, metres:bestD}:null;
}

function commitFamilyPin(pin, {existing, skipDup}={}){
  if(!existing && !skipDup){
    const near=nearbyPlace(pin.lat, pin.lng, pin.id);
    if(near){
      showDupChoice(near, pin);
      return;
    }
  }
  FamilySync.upsertLocal(pin);
  afterFamilySave(pin);
}

      `<div class="field"><label for="pindesc">Description</label><textarea id="pindesc" name="desc" maxlength="499" placeholder="Anything the others should know">${esc(desc)}</textarea></div>`+
      `<div class="cact">`+
        `<button type="submit" class="cbtn csave">Save pin</button>`+
        `<button type="button" class="cbtn ccancel" id="cancelform">Cancel</button>`+
      `</div>`+
    `</form>`;
  resetSheetHeight();
  card.classList.remove('journey');
  card.classList.add('open');
  const howWrap=document.getElementById('pinhow');
  const catField=document.getElementById('pincatfield');
  const newCatField=document.getElementById('newcatfield');
  const catSel=document.getElementById('pincat');
  const syncHow=()=>{
    const how=howWrap.querySelector('.modebtn[aria-pressed="true"]')?.dataset.how||'drive';
    catField.hidden=how!=='drive';
    if(newCatField) newCatField.hidden=how!=='drive' || catSel.value!=='__new__';
  };
  catSel.onchange=syncHow;
  howWrap.querySelectorAll('.modebtn').forEach(b=>{
    b.onclick=()=>{
      howWrap.querySelectorAll('.modebtn').forEach(x=>x.setAttribute('aria-pressed', x===b?'true':'false'));
      syncHow();
    };
  });
  syncHow();
  document.getElementById('cancelform').onclick=()=>{
    if(!existing){ closeCard(); return; }
    openCard(existing);
  };
  document.getElementById('pinform').onsubmit=e=>{
    e.preventDefault();
    const n=document.getElementById('pinname').value.trim();
    const d=document.getElementById('pindesc').value.trim();
    const addedBy=existing?(existing.addedBy||myName()):myName();
    const how=howWrap.querySelector('.modebtn[aria-pressed="true"]')?.dataset.how||'drive';
    let cat=catSel.value;
    let catLabel='';
    if(how==='drive' && cat==='__new__'){
      const label=document.getElementById('newcat').value.trim();
      if(!label){ toast('Name the new category.'); return; }
      cat=slugCat(label);
      if(!BUILT_CAT.has(cat)) catLabel=label.slice(0,24);
    } else if(how==='drive' && !BUILT_CAT.has(cat)){
      const known=customCats().find(c=>c.id===cat);
      catLabel=(known&&known.label)||'';
    } else if(how==='drive' && !PIN_CATS.some(c=>c.id===cat)){
      cat='family';
    }
    if(!n){ toast('Give the pin a name.'); return; }
    const pin=existing
      ? Object.assign({}, existing, {name:n, desc:d, addedBy, updatedAt:nowIso(), deleted:false})
      : {id:uuid(), name:n, desc:d, lat, lng, addedBy, createdAt:nowIso(), updatedAt:nowIso(), deleted:false};
    if(how==='bike'){
      pin.bike='stop';
      delete pin.walk;
      pin.cat='family';
      pin.emoji='🚲';
    } else if(how==='walk'){
      pin.walk=(existing && existing.walk && typeof existing.walk==='object')?existing.walk:{};
      delete pin.bike;
      pin.cat='family';
      pin.emoji='🚶';
    } else {
      pin.cat=cat;
      pin.emoji=CAT_EMOJI[cat]||'📍';
      if(catLabel) pin.catLabel=catLabel;
      else delete pin.catLabel;
      delete pin.bike;
      delete pin.walk;
    }
    commitFamilyPin(pin, {existing});
  };
  setTimeout(()=>document.getElementById('pinname').focus(), 50);
}

function startGpsPin(){
  if(!navigator.geolocation){ toast('This phone cannot share its location.'); return; }
  const btn=document.getElementById('addhere');
  if(btn) btn.disabled=true;
  toast('Finding your location…');
  navigator.geolocation.getCurrentPosition(pos=>{
    hideToast();
    openPinForm({lat:pos.coords.latitude, lng:pos.coords.longitude, source:'gps'});
  }, err=>{
    if(btn) btn.disabled=false;
    const msg=err && err.code===1
      ? 'Location is turned off for this app. You can enable it in Settings, then try again.'
      : 'Could not find your location. Try again somewhere more open.';
    toast(msg);
  }, {enableHighAccuracy:true, timeout:15000, maximumAge:10000});
}

async function checkClan(){
  if(clanOk()) return true;
  const input=document.getElementById('helpgate');
  const answer=String(input&&input.value||'').trim();
  if(!answer){ toast('Type the dog\'s name, then tap Continue.'); return false; }
  let r, data={};
  try{
    r=await fetch('/api/gate',{
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({answer})
    });
    data=await r.json().catch(()=>({}));
  }catch(err){
    toast(looksOffline(err)
      ? 'This check needs a connection the first time. Try again on Wi-Fi.'
      : 'Could not check that. Try again.');
    return false;
  }
  if(!r.ok || !data.trip){
    toast(data.error||"That's not it. Try again.");
    if(input){ input.focus(); input.select(); }
    return false;
  }
  rememberClan(data.trip);
  return true;
}

        const input=document.getElementById('helpname');
        const n=setMyName(input?input.value:'');
        if(!n){ toast('Type your name, then tap Continue.'); return; }
        helpAskName=false;
        helpEditName=false;
      }
      if(helpFirst){ helpView='tour'; helpTourI=0; paintHelp(); }
      else if(helpUnlock){ closeHelp(); }
      else { helpView='index'; paintHelp(); }
    }finally{ helpBusy=false; }
    return;
  }
  if(helpView==='tour'){
    if(helpTourI>=HELP_TOUR.length-1){ closeHelp(); return; }
    helpTourI+=1;
    paintHelp();
  }
}
helpEl.addEventListener('click', e=>{
  const btn=e.target.closest('[data-help]');
  if(!btn) return;
  const act=btn.dataset.help;
  if(act==='next') helpNext();
  else if(act==='skip' || act==='close') closeHelp();
  else if(act==='editname'){ helpEditName=true; paintHelp(); }
  else if(act==='back'){ helpView='index'; paintHelp(); }
  else if(act==='topic'){ helpTopic=btn.dataset.id; helpView='topic'; paintHelp(); }
});
document.addEventListener('keydown', e=>{
  if(e.key!=='Escape' || !helpEl.classList.contains('show')) return;
  if(!clanOk() || !myName()) return;
  closeHelp();
});

function clientToLatLng(clientX, clientY){
  const svg=document.getElementById('basemap');
  const pt=svg.createSVGPoint();
  pt.x=clientX; pt.y=clientY;
  const ctm=svg.getScreenCTM();
  if(!ctm) return null;
  const p=pt.matrixTransform(ctm.inverse());
  if(p.x<0||p.x>W||p.y<0||p.y>H) return null;
  return unproj(p.x, p.y);
}
function addPinAtClient(clientX, clientY){
  const ll=clientToLatLng(clientX, clientY);
  if(!ll){ toast('Drop a pin on the map.'); return; }
  openPinForm({lat:ll.lat, lng:ll.lng, approx:true});
}

(function mapNav(){
  const stage=document.getElementById('stage');
  const fit=document.getElementById('mapfit');
  const svg=document.getElementById('basemap');
  const MIN=1, MAX=120;
  let scale=1, vx=0, vy=0, pinScreen=1;
  const pointers=new Map();
  let pinch0=null, pan0=null, holdTimer=null, holdX=0, holdY=0, ignoreMenu=false, didMove=false;
  const btnIn=document.getElementById('zoomin'), btnOut=document.getElementById('zoomout');

  function baseSize(){
    const sw=Math.max(1, fit.clientWidth), sh=Math.max(1, fit.clientHeight);
    const ar=sw/sh;
    if(W/H>ar) return {bw:W, bh:W/ar};
    return {bw:H*ar, bh:H};
  }
  function currentView(){
    const {bw,bh}=baseSize();
    return {vw:bw/scale, vh:bh/scale};
  }
  function clampView(){
    const {vw,vh}=currentView();
    if(scale<=1.001){
      scale=1;
      const {bw,bh}=baseSize();
      vx=(W-bw)/2; vy=(H-bh)/2;
      return;
    }
    vx=vw>=W?(W-vw)/2:Math.min(W-vw, Math.max(0, vx));
    vy=vh>=H?(H-vh)/2:Math.min(H-vh, Math.max(0, vy));
  }
  function apply(opts){
    if(!opts||!opts.skipClamp) clampView();
    const {vw,vh}=currentView();
    svg.setAttribute('viewBox', `${vx.toFixed(2)} ${vy.toFixed(2)} ${vw.toFixed(2)} ${vh.toFixed(2)}`);
    fit.style.setProperty('--pin-scale', String(1/scale));
    pinScreen=scale<=6?1:Math.min(1.45, 1+(scale-6)*0.006);
    fit.style.setProperty('--pin-screen', String(pinScreen));
    const town=scale<=7?0:scale>=15?1:(scale-7)/8;
    fit.style.setProperty('--town-opacity', String(town));
    const lm=scale<=9?0:scale>=16?1:(scale-9)/7;
    fit.style.setProperty('--lastmile-opacity', String(lm));
    const pinLabs=showPinLabels;
    fit.style.setProperty('--pin-labels', pinLabs?'1':'0');
    fit.classList.toggle('show-pin-labels', pinLabs);
    const lbl=scale<=2.4?1:scale>=6?0:1-(scale-2.4)/(6-2.4);
    fit.style.setProperty('--lbl-opacity', String(lbl));
    btnIn.disabled=scale>=MAX-0.01;
    btnOut.disabled=scale<=MIN+0.01;
    if(typeof syncPinVisibility==='function') syncPinVisibility();
    if(typeof positionPins==='function') positionPins();
    if(typeof renderOffmap==='function') renderOffmap();
  }
  function sheetOverlap(fr){
    if(!card.classList.contains('open')) return 0;
    const cr=card.getBoundingClientRect();
    return Math.max(0, Math.min(fr.height, fr.bottom-cr.top));
  }
  function centerOn(lng, lat, wantScale){
    const [x,y]=proj(lng,lat);
    scale=Math.max(MIN, Math.min(MAX, wantScale||15));
    const {vw,vh}=currentView();
    const fr=fit.getBoundingClientRect();
    const overlap=sheetOverlap(fr);
    const visW=Math.max(1, fr.width);
    const visH=Math.max(1, fr.height-overlap);
    const fitW=Math.max(1, fit.clientWidth), fitH=Math.max(1, fit.clientHeight);
    vx=x-(visW/2)/fitW*vw;
    vy=y-(visH/2)/fitH*vh;
    apply({skipClamp:true});
  }
  function fitPoints(pts){
    if(!pts||!pts.length) return;
    const xy=pts.map(p=>proj(p.lng,p.lat));
    let minX=xy[0][0], maxX=xy[0][0], minY=xy[0][1], maxY=xy[0][1];
    xy.forEach(([x,y])=>{ minX=Math.min(minX,x); maxX=Math.max(maxX,x); minY=Math.min(minY,y); maxY=Math.max(maxY,y); });
    const spanX=Math.max(maxX-minX, 12);
    const spanY=Math.max(maxY-minY, 12);
    const fr=fit.getBoundingClientRect();
    const overlap=sheetOverlap(fr);
    const visW=Math.max(1, fr.width);
    const visH=Math.max(1, fr.height-overlap);
    const innerW=visW*0.60, innerH=visH*0.60;
    const fitW=Math.max(1, fit.clientWidth), fitH=Math.max(1, fit.clientHeight);
    const {bw,bh}=baseSize();
    const ar=fitW/fitH;
    let vw=spanX*fitW/innerW;
    const vwFromY=(spanY*fitH/innerH)*ar;
    vw=Math.max(vw, vwFromY);
    let newScale=bw/vw;
    newScale=Math.max(MIN, Math.min(MAX, newScale));
    scale=newScale;
    vw=bw/scale;
    const vh=bh/scale;
    const midX=(minX+maxX)/2, midY=(minY+maxY)/2;
    vx=midX-(visW/2)/fitW*vw;
    vy=midY-(visH/2)/fitH*vh;
    apply({skipClamp:true});
  }
  function fitPair(lng1, lat1, lng2, lat2){
    fitPoints([{lng:lng1, lat:lat1},{lng:lng2, lat:lat2}]);
  }
  function zoomAt(clientX, clientY, newScale){
    const pt=svg.createSVGPoint();
    pt.x=clientX; pt.y=clientY;
    const ctm=svg.getScreenCTM();
    if(!ctm) return;
    const p=pt.matrixTransform(ctm.inverse());
    newScale=Math.max(MIN, Math.min(MAX, newScale));
    const r=fit.getBoundingClientRect();
    const fx=(clientX-r.left)/Math.max(1,r.width);
    const fy=(clientY-r.top)/Math.max(1,r.height);
    scale=newScale;
    const {vw,vh}=currentView();
    vx=p.x-fx*vw;
    vy=p.y-fy*vh;
    apply();
  }
  function cancelHold(){ if(holdTimer){ clearTimeout(holdTimer); holdTimer=null; } }

  window.MapNav={
    onFit(){ apply(); },
    reset(){ scale=1; apply(); },
    pinPct(x,y){
      const {vw,vh}=currentView();
      return {left:((x-vx)/vw*100)+'%', top:((y-vy)/vh*100)+'%'};
    },
    fitPair,
    fitPoints,
    centerOn,
    getScale(){ return scale; },
    getPinScreen(){ return pinScreen; }
  };

  stage.addEventListener('wheel', e=>{
    if(e.target.closest('#mapzoom')) return;
    e.preventDefault();
    zoomAt(e.clientX, e.clientY, scale*(e.deltaY>0?0.9:1.12));
  }, {passive:false});

  stage.addEventListener('pointerdown', e=>{
    if(e.target.closest('#mapzoom,.cluster')) return;
    if(e.pointerType==='mouse' && e.button!==0) return;
    pointers.set(e.pointerId, {x:e.clientX, y:e.clientY});
    didMove=false;
    if(pointers.size>=2){
      cancelHold();
      const pts=[...pointers.values()];
      pinch0={
        dist:Math.hypot(pts[0].x-pts[1].x, pts[0].y-pts[1].y)||1,
        scale,
        x:(pts[0].x+pts[1].x)/2,
        y:(pts[0].y+pts[1].y)/2
      };
      pan0=null;
      return;
    }
    pan0={x:e.clientX, y:e.clientY, vx, vy};
    const pinEl=e.target.closest('.pin');
    holdX=e.clientX; holdY=e.clientY;
    cancelHold();
    holdTimer=setTimeout(()=>{
      holdTimer=null;
      if(didMove||pointers.size!==1) return;
      ignoreMenu=true;
      if(pinEl){
        skipPinClick=true;
        const p=PLACES.find(x=>x.id===pinEl.dataset.id);
        if(p) showIrishFrom(p);
        return;
      }
      addPinAtClient(holdX, holdY);
    }, 550);
  });
  stage.addEventListener('pointermove', e=>{
    if(!pointers.has(e.pointerId)) return;
    pointers.set(e.pointerId, {x:e.clientX, y:e.clientY});
    if(pinch0 && pointers.size>=2){
      const pts=[...pointers.values()];
      const dist=Math.hypot(pts[0].x-pts[1].x, pts[0].y-pts[1].y)||1;
      zoomAt((pts[0].x+pts[1].x)/2, (pts[0].y+pts[1].y)/2, pinch0.scale*(dist/pinch0.dist));
      didMove=true;
      return;
    }
    if(pan0){
      const dx=e.clientX-pan0.x, dy=e.clientY-pan0.y;
      if(dx*dx+dy*dy>64){ didMove=true; cancelHold(); }
      if(didMove && scale>1.01){
        const {vw,vh}=currentView();
        const fw=fit.clientWidth, fh=fit.clientHeight;
        vx=pan0.vx-dx*vw/Math.max(1,fw);
        vy=pan0.vy-dy*vh/Math.max(1,fh);
        apply();
      }
    }
  });
  function endPtr(e){
    pointers.delete(e.pointerId);
    cancelHold();
    if(pointers.size<2) pinch0=null;
    if(pointers.size===0) pan0=null;
    else if(pointers.size===1){
      const p=[...pointers.values()][0];
      pan0={x:p.x, y:p.y, vx, vy};
    }
  }
  stage.addEventListener('pointerup', endPtr);
  stage.addEventListener('pointercancel', endPtr);
  stage.addEventListener('click', e=>{
    if(e.target.closest('#mapzoom,.cluster,.pin,.townmark')) return;
    if(didMove){ e.stopPropagation(); e.preventDefault(); return; }
    if(skipPinClick){ skipPinClick=false; e.stopPropagation(); e.preventDefault(); return; }
    if(card.classList.contains('open')) closeCard();
  }, true);
  stage.addEventListener('contextmenu', e=>{
    e.preventDefault();
    if(e.target.closest('#mapzoom')) return;
    const pinEl=e.target.closest('.pin');
    if(pinEl){
      const p=PLACES.find(x=>x.id===pinEl.dataset.id);
      if(p) showIrishFrom(p);
      return;
    }
    if(ignoreMenu){ ignoreMenu=false; return; }
    addPinAtClient(e.clientX, e.clientY);
  });

  document.getElementById('zoomin').onclick=()=>{
    const r=fit.getBoundingClientRect();
    zoomAt(r.left+r.width/2, r.top+r.height/2, scale*1.45);
  };
  document.getElementById('zoomout').onclick=()=>{
    const r=fit.getBoundingClientRect();
    zoomAt(r.left+r.width/2, r.top+r.height/2, scale/1.45);
  };
  apply();
})();

(function installPrompt(){
  const bar=document.getElementById('installbar');
  const go=document.getElementById('installgo');
  const no=document.getElementById('installno');
  if(!bar||!go||!no) return;
  const LS='nn-install-dismissed';
  const standalone=()=>window.matchMedia('(display-mode: standalone)').matches||window.navigator.standalone===true;
  const mobile=()=>window.matchMedia('(pointer: coarse)').matches||window.matchMedia('(max-width: 820px)').matches;
  const ios=/iphone|ipad|ipod/i.test(navigator.userAgent)||(navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1);
  let deferred=null;
  function hide(){ bar.classList.remove('show'); }
  function show(){
    if(standalone()||!mobile()) return;
    try{ if(Number(localStorage.getItem(LS)||0)>Date.now()) return; }catch(e){}
    bar.classList.add('show');
  }
  window.addEventListener('beforeinstallprompt', e=>{
    e.preventDefault();
    deferred=e;
    show();
  });
  window.addEventListener('appinstalled', ()=>{
    deferred=null;
    try{ localStorage.setItem(LS, String(Date.now()+365*864e5)); }catch(e){}
    hide();
    toast('On your home screen. Open it from there next time.');
  });
  go.onclick=async()=>{
    if(deferred){
      deferred.prompt();
      try{
        const choice=await deferred.userChoice;
        deferred=null;
        if(choice&&choice.outcome==='accepted') hide();
        else {
          try{ localStorage.setItem(LS, String(Date.now()+3*864e5)); }catch(e){}
          hide();
        }
      }catch(err){ hide(); }
      return;
    }
    hide();
    toast(ios?'Safari: tap Share, then Add to Home Screen.':'Chrome: tap the menu (⋮), then Install app.');
  };
  no.onclick=()=>{
    try{ localStorage.setItem(LS, String(Date.now()+7*864e5)); }catch(e){}
    hide();
  };
  if(!standalone() && mobile()) setTimeout(()=>{ if(!standalone()) show(); }, 1800);
})();

async function forceRefresh(){
  if(!navigator.onLine){ toast('No connection at the moment.'); return; }
  toast('Updating…');
  const bust=u=>u+(u.includes('?')?'&':'?')+'_r='+Date.now();
  const required=['index.html','family-sync.js','data/places.json'];
  const extra=['data/irish-directions.json','data/greenway.json','sw.js','manifest.webmanifest'];
  try{
    const fresh=[];
    for(const url of required){
      const r=await fetch(bust(url), {cache:'reload'});
      if(!r.ok) throw new Error(url);
      fresh.push([url, await r.blob(), r.status, r.headers]);
    }
    const more=await Promise.all(extra.map(async url=>{
      try{
        const r=await fetch(bust(url), {cache:'reload'});
        if(!r.ok) return null;
        return [url, await r.blob(), r.status, r.headers];
      }catch(err){ return null; }
    }));
    const make=(blob, status, headers)=>new Response(blob, {status, headers});
    let names=(await caches.keys()).filter(k=>k.startsWith('newport-nav-'));
    if(!names.length) names=['newport-nav-v121'];
    for(const name of names){
      const cache=await caches.open(name);
      for(const [url, blob, status, headers] of fresh){
        await cache.put(url, make(blob, status, headers));
        if(url==='index.html'){
          await cache.put('.', make(blob, status, headers));
          await cache.put('/', make(blob, status, headers));
        }
      }
      for(const row of more){
        if(row) await cache.put(row[0], make(row[1], row[2], row[3]));
      }
    }
    location.reload();
  }catch(err){
    toast('No connection at the moment.');
  }
}
document.getElementById('getlatest').onclick=forceRefresh;

if('serviceWorker' in navigator){
  window.addEventListener('load',()=>{
    navigator.serviceWorker.register('sw.js').then(reg=>{
      reg.update().catch(()=>{});
    }).catch(()=>{});
  });
  // A new worker took over (after a deploy) — reload once so we aren't stuck on the old page.
  if(navigator.serviceWorker.controller){
    let refreshing=false;
    navigator.serviceWorker.addEventListener('controllerchange',()=>{
      if(refreshing) return;
      refreshing=true;
      location.reload();
    });
  }
}
fitSoon();
if(!clanOk()) setTimeout(()=>openHelp({first:!myName()}), 400);
else if(isStandalone() && !myName()) setTimeout(()=>openHelp({first:true}), 400);
