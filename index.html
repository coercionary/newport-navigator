<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover"/>
<title>Newport Navigator</title>
<meta name="description" content="Family map for Lime Kiln House — Newport, Co. Mayo. Works offline."/>
<link rel="manifest" href="manifest.webmanifest"/>
<meta name="theme-color" content="#0f766e"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
<meta name="apple-mobile-web-app-title" content="Newport Nav"/>
<link rel="apple-touch-icon" href="icons/icon.svg"/>
<link rel="icon" href="icons/icon.svg"/>
<style>
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;height:100%;height:100dvh;overflow:hidden;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;color:#243;background:#d4cbb3;}
  body{display:flex;flex-direction:column;}
  #topbar{flex:0 0 auto;z-index:70;position:relative;}
  header{background:linear-gradient(135deg,#0f766e,#0284c7);color:#fff;padding:calc(env(safe-area-inset-top) + 8px) 12px 8px;box-shadow:0 2px 10px rgba(0,0,0,.18);}
  .headrow{display:flex;align-items:center;justify-content:space-between;gap:10px;}
  header h1{margin:0;font-size:16px;display:flex;align-items:center;gap:8px;}
  header p{margin:3px 0 0;font-size:12px;opacity:.92;}
  .upd{background:none;border:none;color:#fff;font:inherit;font-size:12px;font-weight:700;text-decoration:underline;text-underline-offset:2px;cursor:pointer;padding:0;margin:0;}
  .addbtn{flex:0 0 auto;background:#fff;color:#0f766e;border:none;border-radius:999px;padding:8px 12px;font-size:12.5px;font-weight:700;cursor:pointer;white-space:nowrap;}
  .headbtns{display:flex;align-items:center;gap:6px;flex:0 0 auto;}
  .addbtn.alt{background:transparent;color:#fff;border:1.5px solid rgba(255,255,255,.75);}
  #modewrap{display:flex;padding:8px 12px 4px;background:#faf7f0;}
  .modebtn{flex:1;border:1.5px solid #c4bba8;background:#fff;color:#4b5563;padding:7px 6px;font-size:12.5px;font-weight:700;cursor:pointer;font-family:inherit;line-height:1.2;}
  .modebtn + .modebtn{border-left-width:0;}
  .modebtn:first-child{border-radius:9px 0 0 9px;}
  .modebtn:last-child{border-radius:0 9px 9px 0;}
  .modebtn[aria-pressed="true"]{position:relative;z-index:1;border-left-width:1.5px;color:#fff;}
  .modebtn[data-mode="drive"][aria-pressed="true"]{background:#1d4ed8;border-color:#1d4ed8;}
  .modebtn[data-mode="bike"][aria-pressed="true"]{background:#14532d;border-color:#14532d;}
  .modebtn[data-mode="walk"][aria-pressed="true"]{background:#a16207;border-color:#a16207;}
  #filterwrap{display:flex;align-items:center;gap:8px;padding:6px 12px;background:#faf7f0;border-bottom:1px solid #e7e2d6;min-height:40px;}
  .filterbtn{flex:0 0 auto;display:inline-flex;align-items:center;gap:5px;border:1.5px solid #0f766e;background:#0f766e;color:#fff;border-radius:8px;padding:6px 10px;font-size:12.5px;font-weight:700;cursor:pointer;font-family:inherit;}
  .filterbtn[aria-expanded="true"]{background:#115e59;}
  #filtersummary{display:flex;flex-wrap:wrap;gap:4px;align-items:center;min-width:0;flex:1;max-height:2.6em;overflow:hidden;}
  #filtersummary .mini{display:inline-flex;align-items:center;gap:3px;padding:2px 7px;border-radius:999px;font-size:11px;font-weight:700;color:#fff;line-height:1.3;}
  #filtersummary .mini.star{background:#f59e0b;color:#fff;}
  #filtersummary .mini.muted{background:#e7e2d6;color:#6b7280;}
  #filterscrim{display:none;position:fixed;inset:0;z-index:55;background:rgba(15,30,28,.28);}
  #filterscrim.show{display:block;}
  #filtermenu{display:none;position:absolute;left:8px;right:8px;top:100%;z-index:60;background:#fff;border-radius:0 0 12px 12px;box-shadow:0 10px 28px rgba(0,0,0,.2);padding:8px 10px 12px;max-height:min(62dvh,420px);overflow-y:auto;}
  #filtermenu.show{display:block;}
  .frow{display:flex;align-items:center;gap:10px;width:100%;border:none;background:#fff;padding:10px 8px;border-radius:8px;font:inherit;font-size:14px;font-weight:600;color:#243;cursor:pointer;text-align:left;}
  .frow:active{background:#f3f4f6;}
  .fcheck{width:22px;height:22px;border-radius:6px;border:2px solid #d1d5db;display:flex;align-items:center;justify-content:center;flex:0 0 auto;font-size:13px;color:#fff;background:#fff;}
  .frow[aria-pressed="true"] .fcheck{background:#0f766e;border-color:#0f766e;}
  .frow.star[aria-pressed="true"] .fcheck{background:#f59e0b;border-color:#f59e0b;}
  .fdot{width:10px;height:10px;border-radius:50%;flex:0 0 auto;}
  .fsep{height:1px;background:#e7e2d6;margin:4px 8px;}
  .factions{display:flex;gap:8px;padding:8px 8px 0;}
  .factions .cbtn{flex:1;text-align:center;}
  #stage{flex:1 1 auto;min-height:0;position:relative;display:flex;align-items:center;justify-content:center;background:#d4cbb3;overflow:hidden;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;}
  #mapfit{position:absolute;inset:0;overflow:hidden;--pin-scale:1;--lbl-opacity:1;--town-opacity:0;--pin-screen:1;--pin-labels:0;--lastmile-opacity:0;}
  #mapfit svg{display:block;width:100%;height:100%;}
  #mapzoom{position:absolute;right:10px;bottom:10px;z-index:5;display:flex;flex-direction:column;gap:6px;}
  #mapzoom button{width:36px;height:36px;border:none;border-radius:8px;background:#fff;color:#0f766e;font-size:20px;font-weight:700;line-height:1;box-shadow:0 2px 8px rgba(0,0,0,.22);cursor:pointer;font-family:inherit;}
  #mapzoom button:disabled{opacity:.35;cursor:default;}
  #pins{position:absolute;inset:0;z-index:2;}
  #yarn,#leads{position:absolute;inset:0;z-index:1;pointer-events:none;overflow:visible;}
  #yarn path{fill:none;stroke:#a21caf;stroke-width:1.1;stroke-linecap:round;stroke-dasharray:2.2 1.8;filter:drop-shadow(0 1px 1px rgba(0,0,0,.25));}
  #leads path{fill:none;stroke:#5b4e34;stroke-width:0.45;stroke-linecap:round;opacity:.7;}
  #leads circle{fill:#5b4e34;stroke:#fff;stroke-width:0.22;}
  #yarn path.draw{animation:yarnin .4s ease-out;}
  @keyframes yarnin{from{opacity:0}to{opacity:1}}
  .pin.picked .bub{box-shadow:0 0 0 3px #fff,0 0 0 6px #a21caf,0 2px 5px rgba(0,0,0,.35);}
  .pin.picked{z-index:4;}
  #pins.finding .pin{opacity:.38;transition:opacity .2s;}
  #pins.finding .pin.picked,#pins.finding .pin.irish-lit{opacity:1;}
  .pin.irish-lit{z-index:5;}
  .pin.irish-lit .bub{box-shadow:0 0 0 3px #fff,0 0 0 7px #14532d,0 0 14px rgba(20,83,45,.55);}
  @keyframes irishpulse{50%{box-shadow:0 0 0 3px #fff,0 0 0 10px #166534,0 0 18px rgba(20,83,45,.7);}}
  .pin.irish-lit .bub{animation:irishpulse 1.3s ease-in-out infinite;}
  .pin{position:absolute;transform:translate(-50%,-100%) scale(var(--pin-screen,1));transform-origin:50% 100%;cursor:pointer;touch-action:manipulation;}
  .pin .bub{width:28px;height:28px;border-radius:50% 50% 50% 3px;transform:rotate(45deg);border:2px solid #fff;box-shadow:0 2px 5px rgba(0,0,0,.35);display:flex;align-items:center;justify-content:center;}
  .pin .bub span{transform:rotate(-45deg);font-size:13px;line-height:1;}
  .pin.home-pin{z-index:6;}
  .pin.home-pin .bub{width:36px;height:36px;}
  .pin.home-pin .bub span{font-size:17px;}
  .pin .st{position:absolute;top:-6px;right:-7px;width:14px;height:14px;border-radius:50%;background:#f59e0b;color:#fff;font-size:9px;line-height:14px;text-align:center;border:1.5px solid #fff;}
  .pin .plab{position:absolute;font-size:11px;font-weight:700;color:#243;background:rgba(255,252,245,.96);border:1px solid rgba(91,78,52,.2);padding:2px 6px;border-radius:4px;white-space:nowrap;pointer-events:none;opacity:var(--pin-labels,0);box-shadow:0 1px 2px rgba(0,0,0,.12);line-height:1.2;}
  #mapfit.show-pin-labels .pin .plab{pointer-events:auto;cursor:pointer;}
  .pin.lab-s .plab{left:50%;top:100%;transform:translate(-50%,5px) scale(calc(1 / var(--pin-screen,1)));transform-origin:50% 0;}
  .pin.lab-n .plab{left:50%;top:0;transform:translate(-50%,calc(-100% - 8px)) scale(calc(1 / var(--pin-screen,1)));transform-origin:50% 100%;}
  .pin.lab-e .plab{left:100%;top:8px;transform:translate(6px,-50%) scale(calc(1 / var(--pin-screen,1)));transform-origin:0 50%;}
  .pin.lab-w .plab{left:0;top:8px;transform:translate(calc(-100% - 6px),-50%) scale(calc(1 / var(--pin-screen,1)));transform-origin:100% 50%;}
  .pin.lab-ne .plab{left:100%;top:0;transform:translate(5px,calc(-100% - 2px)) scale(calc(1 / var(--pin-screen,1)));transform-origin:0 100%;}
  .pin.lab-nw .plab{left:0;top:0;transform:translate(calc(-100% - 5px),calc(-100% - 2px)) scale(calc(1 / var(--pin-screen,1)));transform-origin:100% 100%;}
  .pin.lab-se .plab{left:100%;top:100%;transform:translate(5px,4px) scale(calc(1 / var(--pin-screen,1)));transform-origin:0 0;}
  .pin.lab-sw .plab{left:0;top:100%;transform:translate(calc(-100% - 5px),4px) scale(calc(1 / var(--pin-screen,1)));transform-origin:100% 0;}
  .note{flex:0 0 auto;padding:8px 14px calc(8px + env(safe-area-inset-bottom));font-size:12px;color:#556;background:#faf7f0;border-top:1px solid #e7e2d6;max-height:4.8em;overflow-y:auto;}
  .note b{color:#243;}
  #card{position:fixed;left:0;right:0;bottom:0;z-index:100;background:#fff;border-radius:16px 16px 0 0;box-shadow:0 -4px 22px rgba(0,0,0,.22);padding:14px 16px calc(env(safe-area-inset-bottom) + 18px);transform:translateY(115%);transition:transform .25s;max-height:min(78dvh,640px);overflow-y:auto;}
  #card.open{transform:translateY(0);}
  #card .x{position:absolute;top:10px;right:12px;font-size:20px;color:#889;cursor:pointer;line-height:1;}
  .ct{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:6px;}
  .ctag{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.4px;color:#fff;padding:2px 8px;border-radius:999px;}
  .chost{background:#fde68a;color:#7c5c00;}
  .cname{font-size:16px;font-weight:700;margin:2px 0 4px;padding-right:22px;}
  .cplan{margin:0 0 8px;padding:7px 9px;background:#fff7ed;border-left:3px solid #ea580c;border-radius:0 6px 6px 0;color:#7c2d12;font-size:12.5px;font-weight:600;}
  .cdesc{margin:0 0 6px;font-size:13.5px;line-height:1.45;color:#374151;}
  .cinfo{margin:0 0 10px;font-size:12px;color:#6b7280;}
  .cact{display:flex;gap:8px;flex-wrap:wrap;}
  .cbtn{text-decoration:none;font-weight:600;font-size:12.5px;padding:8px 13px;border-radius:8px;border:none;font-family:inherit;cursor:pointer;display:inline-block;}
  .cdir{background:#0f766e;color:#fff;}
  .cgoog{background:#eef2ff;color:#3730a3;border:1px solid #c7d2fe;}
  .ccall{background:#e6f4ea;color:#166534;border:1px solid #b7e0c4;}
  .cedit,.ccancel{background:#f3f4f6;color:#374151;border:1px solid #d1d5db;}
  .cdel{background:#fef2f2;color:#b91c1c;border:1px solid #fecaca;}
  .csave{background:#0f766e;color:#fff;cursor:pointer;}
  .cirish{background:#14532d;color:#fef9c3;border:none;}
  .irishbox{margin:10px 0 0;padding:10px 12px;background:#f0fdf4;border-radius:10px;border:1px solid #bbf7d0;}
  .irishbox p{margin:0 0 8px;font-size:14px;line-height:1.45;color:#14532d;}
  .irishbox p:last-child{margin:0;}
  .irishbox .who{font-size:11px;font-weight:700;letter-spacing:.4px;text-transform:uppercase;color:#166534;margin:0 0 8px;}
  .field{margin:0 0 10px;}
  .field label{display:block;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.4px;color:#6b7280;margin-bottom:4px;}
  .field input,.field textarea{width:100%;border:1.5px solid #d8d2c4;border-radius:8px;padding:8px 10px;font:inherit;font-size:14px;color:#243;background:#fff;}
  .field textarea{min-height:72px;resize:vertical;}
  #toast{position:fixed;left:12px;right:12px;bottom:calc(env(safe-area-inset-bottom) + 16px);z-index:200;background:#1f2937;color:#fff;padding:10px 14px;border-radius:10px;font-size:13px;line-height:1.4;box-shadow:0 4px 16px rgba(0,0,0,.25);display:none;}
  #toast.show{display:block;}
  #people{display:none;position:fixed;inset:0;z-index:85;background:#faf7f0;overflow-y:auto;padding:calc(env(safe-area-inset-top) + 12px) 16px calc(env(safe-area-inset-bottom) + 24px);}
  #people.show{display:block;}
  .peoplehead{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px;}
  .peoplehead h2{margin:0;font-size:18px;}
  .psec{font-size:11px;font-weight:700;letter-spacing:.5px;text-transform:uppercase;color:#6b7280;margin:16px 0 8px;}
  .person{display:flex;gap:12px;align-items:flex-start;background:#fff;border:1px solid #e7e2d6;border-radius:12px;padding:12px;margin-bottom:8px;}
  .pphoto{width:64px;height:64px;border-radius:50%;object-fit:cover;background:#e7e2d6;flex:0 0 auto;display:flex;align-items:center;justify-content:center;font-weight:700;color:#6b7280;font-size:18px;overflow:hidden;}
  .pphoto img{width:100%;height:100%;object-fit:cover;}
  .pbody{min-width:0;flex:1;}
  .pname{font-size:16px;font-weight:700;margin:0 0 2px;}
  .prole{font-size:12px;color:#6b7280;margin:0 0 6px;}
  .pbio{font-size:13.5px;line-height:1.45;color:#374151;margin:0 0 8px;}
  .pact{display:flex;flex-wrap:wrap;gap:6px;}
  .phint{font-size:13px;color:#6b7280;margin:4px 0 12px;}
  .lastmile .who,#lastmile .who{font-size:11px;font-weight:700;letter-spacing:.4px;text-transform:uppercase;color:#c2410c;margin:0 0 8px;}
  #lastmile p,.lastmile p{margin:0 0 8px;font-size:13.5px;line-height:1.45;color:#7c2d12;}
  #lastmile p:last-child,.lastmile p:last-child{margin:0;}
  #card.lastmile-open{overflow:hidden;}
  #lastmile{display:none;position:absolute;inset:0;z-index:4;background:#fffaf5;border-radius:16px 16px 0 0;padding:14px 16px calc(env(safe-area-inset-bottom) + 18px);overflow-y:auto;}
  #lastmile.show{display:block;}
  .lm-link{display:inline-block;margin:12px 0 0;background:none;border:none;padding:0;font:inherit;font-size:13.5px;font-weight:700;color:#c2410c;text-decoration:underline;text-underline-offset:3px;cursor:pointer;text-align:left;}
  #lastmile .lm-steps{margin:0 0 14px;padding:0 0 0 1.2em;color:#7c2d12;}
  #lastmile .lm-steps li{margin:0 0 8px;font-size:14.5px;line-height:1.45;font-weight:600;}
  #lastmile .lm-steps li:last-child{margin:0 0 2px;}
  #lastmile .lm-meta{margin:0 0 10px;font-size:12px;color:#9a3412;}
  #mapfit.show-lastmile .lastmile-route{opacity:.92;}
  #mapfit.drive-mode .nroad-line{stroke-width:calc(10.2 * var(--pin-scale,1));}
  #mapfit.drive-mode .greenway,#mapfit.drive-mode .greenway-dash{opacity:.38;}
  #mapfit.drive-mode .walkway{opacity:.28;}
  #mapfit.bike-mode .greenway{stroke:#dc2626;stroke-width:calc(9 * var(--pin-scale,1));stroke-dasharray:none;}
  #mapfit.bike-mode .greenway-dash{stroke-width:calc(3.4 * var(--pin-scale,1));opacity:1;}
  #mapfit.bike-mode .walkway{opacity:.28;}
  #mapfit.walk-mode .walkway{stroke:#ca8a04;stroke-width:calc(6.2 * var(--pin-scale,1));opacity:1;}
  #mapfit.walk-mode .greenway,#mapfit.walk-mode .greenway-dash{opacity:.4;}
  .gw-seg{fill:none;stroke:#eab308;stroke-width:calc(5.2 * var(--pin-scale,1));stroke-linecap:round;stroke-linejoin:round;opacity:0;}
  #mapfit .gw-seg.on{opacity:.95;}
  .pin.gw-pin .bub{background:#15803d;}
  .pin.rental-pin .bub{background:#ca8a04;}
  .pin.walk-pin .bub{background:#a16207;}
  .cbtn.cbike{background:#14532d;color:#fefce8;}
  .cbtn.cwalk{background:#a16207;color:#fffbeb;}
  .walkloops{margin:0 0 10px;padding:8px 10px;background:#fffbeb;border:1px solid #fde68a;border-radius:10px;}
  .walkloops p{margin:0 0 6px;font-size:13px;line-height:1.4;color:#7c4a03;}
  .walkloops p:last-child{margin:0;}
  .walkloops .who{font-size:11px;font-weight:700;letter-spacing:.4px;text-transform:uppercase;color:#a16207;margin:0 0 8px;}
  .photopick{display:flex;align-items:center;gap:10px;margin-bottom:10px;}
  .photopick input[type=file]{font-size:12px;}
  #loading{padding:40px 20px;text-align:center;color:#889;}
  @media (max-width:400px){
    header h1{font-size:15px;}
    header p{font-size:11px;}
    .addbtn{padding:7px 10px;font-size:12px;}
    #homebtn .home-lbl{display:none;}
    .modebtn{font-size:12px;padding:7px 4px;}
  }
</style>
</head>
<body>
<div id="topbar">
<header>
  <div class="headrow">
    <div>
      <h1>🧭 Newport Navigator</h1>
      <p>Lime Kiln House · Clew Bay · <button type="button" class="upd" id="getlatest">Get latest</button></p>
    </div>
    <div class="headbtns">
      <button type="button" class="addbtn alt" id="homebtn" aria-label="Go to Lime Kiln House">🏡 <span class="home-lbl">Home</span></button>
      <button type="button" class="addbtn alt" id="peoplebtn">Contacts</button>
      <button type="button" class="addbtn" id="addpin">📍 Add pin</button>
    </div>
  </div>
</header>
<div id="modewrap" role="radiogroup" aria-label="How you're getting around">
  <button type="button" class="modebtn" data-mode="drive" aria-pressed="true">🚗 Drive</button>
  <button type="button" class="modebtn" data-mode="bike" aria-pressed="false">🚴 Bikes</button>
  <button type="button" class="modebtn" data-mode="walk" aria-pressed="false">🚶 Walks</button>
</div>
<div id="filterwrap">
  <button type="button" class="filterbtn" id="filterbtn" aria-expanded="false" aria-controls="filtermenu">Filters</button>
  <div id="filtersummary"></div>
</div>
<div id="filtermenu" role="dialog" aria-label="Filters"></div>
</div>
<div id="filterscrim"></div>

<div id="stage">
  <div id="mapfit" class="drive-mode">
  <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 1545.0" preserveAspectRatio="none" id="basemap">
    <rect x="-4000" y="-4000" width="9000" height="9000" fill="#d4cbb3"/>
    <rect x="0" y="0" width="1100" height="1545.0" fill="#bfe0e8"/>
    <style>
      .land{fill:#e9e0c8;stroke:#d2c6a3;stroke-width:0.6}
      .isle{fill:#d8cba6;stroke:#c9bd97;stroke-width:0.5}
      .sand{fill:#efe3b8;stroke:#d4c48a;stroke-width:0.4}
      .lake{fill:#bfe0e8;stroke:#b8ad8a;stroke-width:1.2}
      .peak{fill:#b7a77f;stroke:#8f7f57;stroke-width:1}.peakcross{stroke:#5b4e34;stroke-width:2}
      .greenway{fill:none;stroke:#dc2626;stroke-width:calc(5.6 * var(--pin-scale,1));stroke-linecap:round;stroke-linejoin:round}
      .greenway-dash{fill:none;stroke:#fff;stroke-width:calc(2.1 * var(--pin-scale,1));stroke-dasharray:calc(6.5 * var(--pin-scale,1)) calc(5 * var(--pin-scale,1));stroke-linecap:round;stroke-linejoin:round;opacity:.95}
      .walkway{fill:none;stroke:#eab308;stroke-width:calc(4.4 * var(--pin-scale,1));stroke-dasharray:calc(7 * var(--pin-scale,1)) calc(5.5 * var(--pin-scale,1));stroke-linecap:round;stroke-linejoin:round;opacity:.9}
      .gw-seg{fill:none;stroke:#eab308;stroke-width:calc(5.2 * var(--pin-scale,1));stroke-linecap:round;stroke-linejoin:round;opacity:0}
      .nroad{fill:none;stroke:#fff;stroke-width:calc(16 * var(--pin-scale,1));stroke-linecap:round;stroke-linejoin:round}
      .nroad-line{fill:none;stroke:#c17f0a;stroke-width:calc(9 * var(--pin-scale,1));stroke-linecap:round;stroke-linejoin:round}
      .rroad{fill:none;stroke:#fff8e8;stroke-width:calc(11 * var(--pin-scale,1));stroke-linecap:round;stroke-linejoin:round}
      .rroad-line{fill:none;stroke:#a67c1a;stroke-width:calc(5.5 * var(--pin-scale,1));stroke-linecap:round;stroke-linejoin:round}
      .lroad{fill:none;stroke:#fff6dc;stroke-width:calc(7 * var(--pin-scale,1));stroke-linecap:round;stroke-linejoin:round}
      .lroad-line{fill:none;stroke:#8a7344;stroke-width:calc(2.8 * var(--pin-scale,1));stroke-linecap:round;stroke-linejoin:round}
      .river{fill:none;stroke:#bfe0e8;stroke-width:calc(4 * var(--pin-scale,1));stroke-linecap:round}
      .town{fill:#2c3340;stroke:#fff;stroke-width:1.6;transform:scale(var(--pin-scale,1));transform-box:fill-box;transform-origin:center}
      .home{fill:#e11d48;stroke:#fff;stroke-width:1.6;transform:scale(var(--pin-scale,1));transform-box:fill-box;transform-origin:center}
      #basemap text, #basemap .lbl-leg{opacity:var(--lbl-opacity,1)}

<script>
// Visual style per category (labels + places come from data/places.json)
const STYLE={home:{color:"#e11d48"},food:{color:"#ea580c"},shop:{color:"#16a34a"},beach:{color:"#0284c7"},do:{color:"#7c3aed"},golf:{color:"#0d9488"},family:{color:"#db2777"}};

// projection MUST match the basemap generator
const W=1100, H=1545.0, lngMin=-10.35, lngMax=-8.95, latMin=53.2, latMax=54.36;
const pxPerDegLng=W/(lngMax-lngMin), pxPerDegLat=H/(latMax-latMin);
const proj=(lng,lat)=>[(lng-lngMin)*pxPerDegLng,(latMax-lat)*pxPerDegLat];
const unproj=(x,y)=>({lng:lngMin+(x/W)*(lngMax-lngMin), lat:latMax-(y/H)*(latMax-latMin)});

const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const nowIso=()=>new Date().toISOString();
const uuid=()=>(crypto.randomUUID?crypto.randomUUID():('p-'+Date.now()+'-'+Math.random().toString(16).slice(2)));

(function stripRefreshParam(){
  const u=new URL(location.href);
  if(!u.searchParams.has('_r')) return;
  u.searchParams.delete('_r');
  history.replaceState({},'',u.pathname+u.search+u.hash);
})();

function fitMap(){
  if(window.MapNav) MapNav.onFit();
}
window.addEventListener('resize', fitMap);
if(window.visualViewport) visualViewport.addEventListener('resize', fitMap);
window.addEventListener('orientationchange', ()=>setTimeout(fitMap, 250));

let CATS={}, CURATED=[], PLACES=[], IRISH={}, active=new Set(), hostOnly=false;
let showPinLabels=localStorage.getItem('nn-pin-labels')!=='0';
let mode='drive', GREENWAY={samples:[]};
let HOME=null, HOST=null;
const LS_PARTY='nn-party';
const pinsEl=document.getElementById('pins'), offEl=document.getElementById('offmap');
let pinNodes=[];
let picked=[];
let irishLit=new Set();
const IRISH_FROM={};
const toastEl=document.getElementById('toast');
let toastTimer=null;

function toast(msg){
  toastEl.textContent=msg; toastEl.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer=setTimeout(()=>toastEl.classList.remove('show'), 4200);
}
function hideToast(){ clearTimeout(toastTimer); toastEl.classList.remove('show'); }

function loadParty(){
  try { return JSON.parse(localStorage.getItem(LS_PARTY)||'[]'); } catch { return []; }
}
function saveParty(list){ localStorage.setItem(LS_PARTY, JSON.stringify(list)); }
function lastMileSteps(fromWest){
  return (HOME&&(fromWest?HOME.approachFromWest:HOME.approach))||[];
}
function lastMileLink(fromWest){
  const has=lastMileSteps(fromWest).length||(!fromWest&&HOME&&HOME.fromBridge&&HOME.fromBridge.length);
  if(!has) return '';
  const label=fromWest?"Last mile — from Mulranny / Achill":"Last mile — from the steel bridge";
  return `<button type="button" class="lm-link" id="lastmilebtn">${esc(label)}</button>`;
}
function openLastMile(fromWest){
  const steps=lastMileSteps(fromWest);
  const bridge=(!fromWest&&HOME&&HOME.fromBridge)||[];
  if(!steps.length&&!bridge.length) return;
  let html='';
  if(bridge.length){
    html+=`<p class="who">From the steel bridge — Google Maps</p>`+
      `<p class="lm-meta">1.5 km · 3 min · then Louisa's landmarks below</p>`+
      `<ol class="lm-steps">${bridge.map(s=>`<li>${esc(s)}</li>`).join('')}</ol>`;
  }
  if(steps.length){
    html+=`<p class="who">${fromWest?"Last mile — from Mulranny / Achill":"Louisa's landmarks"}</p>`+
      steps.map(s=>`<p>${esc(s)}</p>`).join('');
  }
  document.getElementById('lastmilebody').innerHTML=html;
  document.getElementById('lastmile').classList.add('show');
  card.classList.add('lastmile-open');
  syncLastMileMap();
  const house=PLACES.find(p=>p.id==='lime-kiln-house');
  const bridgePt={lng:-9.5724, lat:53.9022};
  requestAnimationFrame(()=>{
    requestAnimationFrame(()=>{
      if(window.MapNav && house) MapNav.fitPoints(fromWest?[house]:[bridgePt, house]);
    });
  });
}
function closeLastMile(){
  const el=document.getElementById('lastmile');
  if(el) el.classList.remove('show');
  if(card) card.classList.remove('lastmile-open');
  syncLastMileMap();
}
function syncLastMileMap(){
  const fit=document.getElementById('mapfit');
  if(!fit) return;
  const overlay=document.getElementById('lastmile')?.classList.contains('show');
  const houseOpen=picked.length===1 && picked[0] && picked[0].id==='lime-kiln-house';
  const homebound=picked.length===2 && picked[1] && picked[1].id==='lime-kiln-house';
  fit.classList.toggle('show-lastmile', !!(overlay||houseOpen||homebound));
}
function bindLastMile(fromWest){
  const btn=document.getElementById('lastmilebtn');
  if(btn) btn.onclick=()=>openLastMile(!!fromWest);
}
function initials(name){
  return String(name||'?').split(/\s+/).filter(Boolean).slice(0,2).map(w=>w[0].toUpperCase()).join('')||'?';
}
function photoEl(person){
  if(person.photo) return `<div class="pphoto"><img src="${person.photo}" alt=""></div>`;
  return `<div class="pphoto">${esc(initials(person.name))}</div>`;
}
function telHref(t){ return 'tel:'+String(t||'').replace(/[^\d+]/g,''); }
function closePeople(){
  document.getElementById('people').classList.remove('show');
}
function compressPhoto(file){
  return new Promise((resolve,reject)=>{
    const img=new Image();
    const url=URL.createObjectURL(file);
    img.onload=()=>{
      const max=480;
      const s=Math.min(1, max/Math.max(img.width,img.height));
      const c=document.createElement('canvas');
      c.width=Math.max(1,Math.round(img.width*s));
      c.height=Math.max(1,Math.round(img.height*s));
      c.getContext('2d').drawImage(img,0,0,c.width,c.height);
      URL.revokeObjectURL(url);
      resolve(c.toDataURL('image/jpeg',0.82));
    };
    img.onerror=()=>{ URL.revokeObjectURL(url); reject(new Error('photo')); };
    img.src=url;
  });
}
function renderPersonCard(person, opts){
  const call=person.tel?`<a class="cbtn ccall" href="${telHref(person.tel)}">Call${person.telDisplay?' '+esc(person.telDisplay):''}</a>`:'';
  const edit=opts&&opts.edit?`<button type="button" class="cbtn cedit" data-edit="${esc(person.id)}">Edit</button>`:'';
  const hostPic=opts&&opts.hostPhoto?`<button type="button" class="cbtn cedit" id="hostpicbtn">${person.photo?'Change photo':'Add photo'}</button><input type="file" id="hostpic" accept="image/*" hidden>`:'';
  return `<article class="person">${photoEl(person)}<div class="pbody">`+
    `<p class="pname">${esc(person.name)}</p>`+
    `<p class="prole">${esc(person.role||'Party')}</p>`+
    (person.bio?`<p class="pbio">${esc(person.bio)}</p>`:'')+
    `<div class="pact">${call}${edit}${hostPic}</div></div></article>`;
}
function openPeople(){
  closeFilterMenu();
  closeCard();
  paintPeople();
  document.getElementById('people').classList.add('show');
}
function paintPeople(editingId){
  const el=document.getElementById('people');
  const party=loadParty();
  const hostPhoto=localStorage.getItem('nn-host-photo')||'';
  const host=HOST?Object.assign({}, HOST, hostPhoto?{photo:hostPhoto}:{}):null;
  if(editingId){
    const p=editingId==='new'?{id:'new',name:'',tel:'',bio:'',photo:''}:party.find(x=>x.id===editingId);
    if(!p){ paintPeople(); return; }
    el.innerHTML=
      `<div class="peoplehead"><h2>${p.id==='new'?'Add someone':'Edit'}</h2><button type="button" class="cbtn ccancel" id="peopledone">Cancel</button></div>`+
      `<form id="personform">`+
        `<div class="photopick">${photoEl(p)}<input type="file" id="ppic" accept="image/*"></div>`+
        `<div class="field"><label for="pname">Name</label><input id="pname" required maxlength="79" value="${esc(p.name)}"></div>`+
        `<div class="field"><label for="ptel">Phone</label><input id="ptel" type="tel" maxlength="40" value="${esc(p.tel||'')}" placeholder="+353 …"></div>`+
        `<div class="field"><label for="pbio">Short bio</label><textarea id="pbio" maxlength="400" placeholder="Anything the others should know">${esc(p.bio||'')}</textarea></div>`+
        `<div class="cact"><button type="submit" class="cbtn csave">Save</button>`+
        (p.id!=='new'?`<button type="button" class="cbtn cdel" id="pdel">Remove</button>`:'')+
        `</div></form>`;
    let photo=p.photo||'';
    document.getElementById('ppic').onchange=async ev=>{
      const f=ev.target.files&&ev.target.files[0];
      if(!f) return;

function placePinEl(el,x,y){
  if(window.MapNav){
    const pct=MapNav.pinPct(x,y);
    el.style.left=pct.left; el.style.top=pct.top;
    const l=parseFloat(pct.left), t=parseFloat(pct.top);
    el.style.display=(el._hidden||l<-12||l>112||t<-12||t>112)?'none':'block';
  } else {
    el.style.left=(x/W*100)+'%'; el.style.top=(y/H*100)+'%';

}
function layoutPinPositions(){
  pinNodes.forEach(n=>{
    n.dx=n.x; n.dy=n.y;
    n.el.classList.remove('lab-n','lab-s','lab-e','lab-w','lab-ne','lab-nw','lab-se','lab-sw');
    n.el.classList.add('lab-s');
    n.el.style.zIndex='';
  });
  const s=window.MapNav&&MapNav.getScale();
  if(!s||s<9) return;
  const svg=document.getElementById('basemap');
  const fit=document.getElementById('mapfit');
  if(!svg||!fit) return;
  const vb=svg.viewBox.baseVal;
  const px=Math.max(1, fit.clientWidth/Math.max(0.001, vb.width));
  const ps=(window.MapNav&&MapNav.getPinScreen())||1;
  const minD=(40*ps)/px;
  const vis=pinNodes.filter(n=>!n.el._hidden);
  const parent=vis.map((_,i)=>i);
  const find=i=>parent[i]===i?i:(parent[i]=find(parent[i]));
  for(let i=0;i<vis.length;i++){
    for(let j=i+1;j<vis.length;j++){
      const dx=vis[i].x-vis[j].x, dy=vis[i].y-vis[j].y;
      if(dx*dx+dy*dy<minD*minD){ const a=find(i), b=find(j); if(a!==b) parent[a]=b; }
    }
  }
  const groups={};
  vis.forEach((n,i)=>{ const r=find(i); (groups[r]=groups[r]||[]).push(n); });
  Object.values(groups).forEach(g=>{
    if(g.length<2) return;
    g.sort((a,b)=>String(a.el.dataset.id).localeCompare(String(b.el.dataset.id)));
    const cx=g.reduce((sum,n)=>sum+n.x,0)/g.length;
    const cy=g.reduce((sum,n)=>sum+n.y,0)/g.length;
    const radPx=Math.max(72*ps, (g.length*68*ps)/(2*Math.PI));
    const rad=radPx/px;
    g.forEach((n,i)=>{
      const ang=-Math.PI/2+i*2*Math.PI/g.length;
      n.dx=cx+rad*Math.cos(ang);
      n.dy=cy+rad*Math.sin(ang);
      n.el.classList.remove('lab-s');
      n.el.classList.add(labelSide(ang));
      n.el.style.zIndex=String(3+i);
    });
  });
}
function labelSide(ang){
  const tau=Math.PI*2;
  let a=ang%tau; if(a<0) a+=tau;
  const deg=a*180/Math.PI;
  if(deg<22.5||deg>=337.5) return 'lab-e';
  if(deg<67.5) return 'lab-se';
  if(deg<112.5) return 'lab-s';
  if(deg<157.5) return 'lab-sw';
  if(deg<202.5) return 'lab-w';
  if(deg<247.5) return 'lab-nw';
  if(deg<292.5) return 'lab-n';
  return 'lab-ne';
}

function nearestGwSample(p){
  const s=GREENWAY.samples||[];
  let best=0, bestD=Infinity;
  for(let i=0;i<s.length;i++){
    const d=(s[i].lat-p.lat)**2+(s[i].lng-p.lng)**2;
    if(d<bestD){ bestD=d; best=i; }
  }
  return best;
}
function gwSegPath(a,b){
  const s=GREENWAY.samples||[];
  if(s.length<2) return '';
  let i=nearestGwSample(a), j=nearestGwSample(b);
  if(i===j) return '';
  if(i>j){ const t=i; i=j; j=t; }
  const pts=s.slice(i,j+1);
  return pts.map((pt,k)=>{
    const [x,y]=proj(pt.lng,pt.lat);
    return (k?'L':'M')+' '+x.toFixed(1)+','+y.toFixed(1);
  }).join(' ');
}

  const el=document.getElementById('gwseg');

  el.classList.toggle('on', !!d);
}
function paintYarn(animate){
  const path=document.getElementById('yarnpath');
  if(!path) return;
  if(picked.length===2 && isGwStop(picked[0]) && isGwStop(picked[1])){
    path.setAttribute('d',''); path.classList.remove('draw');
    paintGwSeg(picked[0], picked[1]);
    return;
  }
  clearGwSeg();
  if(picked.length<2 || !window.MapNav){
    path.setAttribute('d',''); path.classList.remove('draw');
    return;
  }
  const [x1s,y1s]=proj(picked[0].lng,picked[0].lat);
  const [x2s,y2s]=proj(picked[1].lng,picked[1].lat);
  const a=MapNav.pinPct(x1s,y1s), b=MapNav.pinPct(x2s,y2s);
  const x1=parseFloat(a.left), y1=parseFloat(a.top);
  const x2=parseFloat(b.left), y2=parseFloat(b.top);
  const dx=x2-x1, dy=y2-y1, len=Math.hypot(dx,dy)||1;
  const bulge=Math.min(16, len*0.22);
  const cx=(x1+x2)/2 - dy/len*bulge;
  const cy=(y1+y2)/2 + dx/len*bulge;
  path.setAttribute('d', `M ${x1.toFixed(2)} ${y1.toFixed(2)} Q ${cx.toFixed(2)} ${cy.toFixed(2)} ${x2.toFixed(2)} ${y2.toFixed(2)}`);
  if(animate){
    path.classList.remove('draw');
    void path.getBoundingClientRect();
    path.classList.add('draw');
  }
}

function clientToLatLng(clientX, clientY){
  const svg=document.getElementById('basemap');
  const pt=svg.createSVGPoint();
  pt.x=clientX; pt.y=clientY;
  const ctm=svg.getScreenCTM();
  if(!ctm) return null;
  const p=pt.matrixTransform(ctm.inverse());
  if(p.x<0||p.x>W||p.y<0||p.y>H) return null;
  return unproj(p.x, p.y);
}

(function mapNav(){

    const visH=Math.max(1, fr.height-overlap);

  });
  function endPtr(e){
    pointers.delete(e.pointerId);
    cancelHold();
    if(pointers.size<2) pinch0=null;
    if(pointers.size===0) pan0=null;
    else if(pointers.size===1){
      const p=[...pointers.values()][0];
      pan0={x:p.x, y:p.y, vx, vy};
    }
  }
  stage.addEventListener('pointerup', endPtr);
  stage.addEventListener('pointercancel', endPtr);
  stage.addEventListener('click', e=>{
    if(didMove){ e.stopPropagation(); e.preventDefault(); }
    if(skipPinClick){ skipPinClick=false; e.stopPropagation(); e.preventDefault(); }
  }, true);
  stage.addEventListener('contextmenu', e=>{
    e.preventDefault();
    if(e.target.closest('#mapzoom')) return;
    const pinEl=e.target.closest('.pin');
    if(pinEl){
      const p=PLACES.find(x=>x.id===pinEl.dataset.id);
      if(p) showIrishFrom(p);
      return;
    }
    if(ignoreMenu){ ignoreMenu=false; return; }
    addPinAtClient(e.clientX, e.clientY);
  });

  document.getElementById('zoomin').onclick=()=>{
    const r=fit.getBoundingClientRect();
    zoomAt(r.left+r.width/2, r.top+r.height/2, scale*1.45);
  };
  document.getElementById('zoomout').onclick=()=>{
    const r=fit.getBoundingClientRect();
    zoomAt(r.left+r.width/2, r.top+r.height/2, scale/1.45);
  };
  apply();
})();

async function forceRefresh(){
  if(!navigator.onLine){ toast('Need a signal to update. Try again on Wi-Fi.'); return; }
  toast('Updating…');
  try{
    if('serviceWorker' in navigator){
      const regs=await navigator.serviceWorker.getRegistrations();
      await Promise.all(regs.map(r=>r.unregister()));
    }
    if('caches' in window){
      const keys=await caches.keys();
      await Promise.all(keys.map(k=>caches.delete(k)));
    }
  }catch(e){}
  const url=new URL(location.href);
  url.searchParams.set('_r', String(Date.now()));
  location.replace(url.toString());
}
document.getElementById('getlatest').onclick=forceRefresh;

if('serviceWorker' in navigator){
  window.addEventListener('load',()=>{
    navigator.serviceWorker.register('sw.js').then(reg=>{
      reg.update().catch(()=>{});
    }).catch(()=>{});
  });
  // A new worker took over (after a deploy) — reload once so we aren't stuck on the old page.
  if(navigator.serviceWorker.controller){
    let refreshing=false;
    navigator.serviceWorker.addEventListener('controllerchange',()=>{
      if(refreshing) return;
      refreshing=true;
      location.reload();
    });
  }
}
fitSoon();
</script>
